name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    # Quality (Lint · Types · Unit) runs on every branch push to catch
    # breakage branch-by-branch before it reaches develop. The heavier
    # Build · E2E and Evalite jobs gate themselves back to trunk pushes
    # + PRs via job-level `if:` conditions below.
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PAYLOAD_SECRET: 'ci-not-a-real-secret'
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  NEXT_PUBLIC_SITE_NAME: 'BP Portfolio (CI)'

jobs:
  quality:
    name: Lint · Types · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + tsdoc)
        run: pnpm lint
      - name: Format check (Prettier)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      # Both staleness gates prettier-format the regenerated file before
      # diffing: committed copies are formatted by lint-staged at commit
      # time, while Payload's generators write unformatted output — a raw
      # diff would flag formatting noise, not real staleness.
      - name: Verify generated Payload types are committed
        run: |
          pnpm generate:types
          pnpm exec prettier --write src/payload-types.ts
          if ! git diff --quiet -- src/payload-types.ts; then
            echo "::error::src/payload-types.ts is stale. Run 'pnpm generate:types' and commit."
            git diff -- src/payload-types.ts
            exit 1
          fi
      - name: Verify generated admin importMap is committed
        run: |
          pnpm generate:importmap
          pnpm exec prettier --write "src/app/(payload)/admin/importMap.js"
          if ! git diff --quiet -- "src/app/(payload)/admin/importMap.js"; then
            echo "::error::admin importMap is stale. Run 'pnpm generate:importmap' and commit."
            git diff -- "src/app/(payload)/admin/importMap.js"
            exit 1
          fi
      - name: Unit tests (Vitest + coverage)
        run: pnpm test:coverage

      - name: Build Storybook (story breakage gate)
        run: pnpm build-storybook

  e2e:
    name: Build · E2E
    runs-on: ubuntu-latest
    needs: quality
    # Heavy job (Postgres service, Playwright, build) — run only on trunk
    # pushes (develop/master/rebuild/**) and pull requests, not on every
    # feature-branch push. Quality above still runs everywhere.
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/heads/rebuild/')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bp_portfolio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: 'postgres://postgres:postgres@localhost:5432/bp_portfolio_ci'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Payload migrations
        run: pnpm migrate
      - name: Seed e2e content
        run: pnpm seed:e2e
      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: E2E tests (Playwright)
        run: pnpm test:e2e
      - name: Storybook interaction tests (Vitest browser mode)
        run: pnpm test:storybook
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  evals:
    name: Evalite (Corvus)
    runs-on: ubuntu-latest
    needs: quality
    # Evalite spends real AI-provider dollars per run — run only on trunk
    # pushes (develop/master/rebuild/**) and pull requests, never on every
    # feature-branch push. (The step-level key gate still skips it when no
    # provider key is present, e.g. fork PRs.)
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/heads/rebuild/')
    continue-on-error: true # TODO(brandon): remove once eval thresholds are trusted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no provider key
        id: gate
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No LLM key available (likely a fork PR); skipping evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable Corepack (pnpm)
        if: steps.gate.outputs.run == 'true'
        run: corepack enable
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run evals
        if: steps.gate.outputs.run == 'true'
        run: pnpm eval:ci
