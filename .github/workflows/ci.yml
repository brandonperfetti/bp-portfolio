name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    # Quality (Lint · Types · Unit) runs on every branch push to catch
    # breakage branch-by-branch before it reaches develop. The heavier
    # Build · E2E and Evalite jobs gate themselves back to trunk pushes
    # + PRs via job-level `if:` conditions below.
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the checked-out repo (no push,
# release, PR comment, or deploy). Declaring read at the workflow level ignores
# any broader repo/org default GITHUB_TOKEN grant and sets all other scopes to
# none. actions/upload-artifact@v4 in Build · E2E uses the Actions runtime token,
# not GITHUB_TOKEN, so it is unaffected.
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PAYLOAD_SECRET: 'ci-not-a-real-secret'
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  NEXT_PUBLIC_SITE_NAME: 'BP Portfolio (CI)'

jobs:
  quality:
    name: Lint · Types · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + tsdoc)
        run: pnpm lint
      - name: Format check (Prettier)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      # Both staleness gates prettier-format the regenerated file before
      # diffing: committed copies are formatted by lint-staged at commit
      # time, while Payload's generators write unformatted output — a raw
      # diff would flag formatting noise, not real staleness.
      - name: Verify generated Payload types are committed
        run: |
          pnpm generate:types
          pnpm exec prettier --write src/payload-types.ts
          if ! git diff --quiet -- src/payload-types.ts; then
            echo "::error::src/payload-types.ts is stale. Run 'pnpm generate:types' and commit."
            git diff -- src/payload-types.ts
            exit 1
          fi
      - name: Verify generated admin importMap is committed
        run: |
          pnpm generate:importmap
          pnpm exec prettier --write "src/app/(payload)/admin/importMap.js"
          if ! git diff --quiet -- "src/app/(payload)/admin/importMap.js"; then
            echo "::error::admin importMap is stale. Run 'pnpm generate:importmap' and commit."
            git diff -- "src/app/(payload)/admin/importMap.js"
            exit 1
          fi
      # A Payload collection/global/field change with no committed migration
      # slips through deploy-time `pnpm migrate` (nothing to apply) yet drifts
      # a deployed environment, where vercel.json's build-time migrate then has
      # nothing to reconcile. Regenerate non-interactively and fail if a
      # migration appears, mirroring the two staleness gates above.
      # `migrate:create` runs with disableDBConnect — it diffs the Payload
      # config against the latest committed snapshot and never connects to a
      # DB, so it lives in this DB-less quality job (which runs on every push,
      # not just PRs/trunk); config load tolerates a missing DATABASE_URI.
      # `--skip-empty` exits 0 without writing a file when the schema is in
      # sync, and is used WITHOUT `--force-accept-warning`, which defeats
      # --skip-empty and always writes an empty stub. `< /dev/null` EOF-closes
      # stdin so a future Payload version that adds a prompt can't hang CI
      # (inert today — the only prompt is already guarded by --skip-empty).
      # New migration files are untracked, so `git status --porcelain` (not
      # `git diff`) is the drift probe.
      - name: Verify Payload schema changes have a committed migration
        run: |
          pnpm payload migrate:create --skip-empty < /dev/null
          if [ -n "$(git status --porcelain src/migrations/)" ]; then
            echo "::error::A Payload schema change is missing its migration. Run 'pnpm migrate:create', add the RLS follow-up for any new table (docs/PAYLOAD.md), and commit the generated migration."
            git status --porcelain src/migrations/
            # Intent-to-add surfaces the new (untracked) migration in `git diff`;
            # scope the printed diff to *.ts so the readable ALTER TABLE shows
            # without dumping the large drizzle snapshot .json. Detection above
            # stays broad — a .ts, .json, or index.ts change all trip the gate.
            git add -N src/migrations/
            git diff -- 'src/migrations/*.ts'
            exit 1
          fi
      - name: Unit tests (Vitest + coverage)
        run: pnpm test:coverage

      - name: Build Storybook (story breakage gate)
        run: pnpm build-storybook

  e2e:
    name: Build · E2E
    runs-on: ubuntu-latest
    needs: quality
    # Heavy job (Postgres service, Playwright, build) — run only on trunk
    # pushes (develop/master/rebuild/**) and pull requests, not on every
    # feature-branch push. Quality above still runs everywhere.
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/heads/rebuild/')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bp_portfolio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: 'postgres://postgres:postgres@localhost:5432/bp_portfolio_ci'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Payload migrations
        run: pnpm migrate
      # Issue #82 acceptance criterion: migrations must be safely re-runnable.
      # Payload's ledger (`payload_migrations`) is what makes a second run a
      # no-op — `migrate()` skips any migration already recorded there and logs
      # `Migrating: <name>` only for ones it actually executes
      # (payload/dist/database/migrations/migrate.js). So "clean no-op" is
      # exactly: exit 0, and zero `Migrating:` lines. A non-zero exit means some
      # migration is not re-runnable; a `Migrating:` line means the first run
      # failed to record it as applied and the DDL got executed twice.
      - name: Assert migrations are idempotent (re-run is a clean no-op)
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/migrate-rerun.log"
          pnpm migrate 2>&1 | tee "$log"
          if grep -q 'Migrating:' "$log"; then
            echo "::error::A second 'pnpm migrate' re-executed a migration; the first run did not record it as applied."
            exit 1
          fi
          echo "Second 'pnpm migrate' executed no migrations - ledger is clean."
      - name: Seed e2e content
        run: pnpm seed:e2e
      # Issue #82, eval tier 2. The site-fact evals in the Evalite job below
      # ask whether Corvus USES what it is handed; this step asks whether what
      # it is handed is correct and permitted, and the two need opposite
      # environments. This one needs a real Postgres with pgvector and the
      # migration applied, which only this job has.
      #
      # It runs the eval root's Vitest tests: the pgvector integration tier
      # (real migrated schema, real HNSW index, real chunker, real
      # embeddingsStore SQL, and the real afterChange/afterDelete hooks invoked
      # as Payload invokes them) plus the pure scorer unit tests, which the
      # repo's `unit` project does not collect because its include globs cover
      # src/ and scripts/ only. `--root evals` picks up the eval root's Vitest
      # config; `*.eval.ts` is not matched by Vitest's default include, so no
      # eval runs here and nothing needs a provider key.
      #
      # The embedder is STUBBED to a deterministic vector and `embedQuery` is
      # mocked to throw, so this spends no provider dollars and a path that
      # started embedding at query time fails the build instead of billing for
      # it. No provider key is set on this job, deliberately. Every row written
      # uses a doc_id >= 900000 and is deleted in afterAll, so the Playwright
      # steps below see the database they would have seen anyway.
      - name: Corvus retrieval integration (pgvector, stubbed embedder)
        run: pnpm exec vitest run --root evals
      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: E2E tests (Playwright)
        run: pnpm test:e2e
      - name: Storybook interaction tests (Vitest browser mode)
        run: pnpm test:storybook
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  evals:
    name: Evalite (Corvus)
    runs-on: ubuntu-latest
    needs: quality
    # Evalite spends real AI-provider dollars per run — run only on trunk
    # pushes (develop/master/rebuild/**) and pull requests, never on every
    # feature-branch push. (The step-level key gate still skips it when no
    # provider key is present, e.g. fork PRs.)
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/develop'
      || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/heads/rebuild/')
    continue-on-error: true # TODO(brandon): remove once eval thresholds are trusted
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no provider key
        id: gate
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "No LLM key available (likely a fork PR); skipping evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable Corepack (pnpm)
        if: steps.gate.outputs.run == 'true'
        run: corepack enable
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run evals
        if: steps.gate.outputs.run == 'true'
        run: pnpm eval:ci
      # Issue #82, decision D4(b): the site-fact block needs its OWN threshold,
      # and evalite cannot express one. `--threshold` is a single global
      # average over every score in the run (evalite 0.19.0,
      # reporter/EvaliteRunner.js) with no per-eval or per-file form — so with
      # one invocation a weak site-fact block hides behind strong persona
      # scores. `evalite run <path>` filters to one file, which is how the
      # block gets a gate of its own. The path is relative to the eval root,
      # because the script cds there first.
      #
      # This re-runs the site-fact evals, so it costs a second pass over that
      # file's cases. That is the price of a per-block gate; keeping the block
      # small is what keeps the price small.
      - name: Run site-fact evals at their own threshold
        if: steps.gate.outputs.run == 'true'
        run: pnpm eval:facts
