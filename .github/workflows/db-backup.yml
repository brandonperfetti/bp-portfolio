# Nightly encrypted Postgres backups (Supabase free tier has no automated
# backups; these are the off-platform copies). TWO targets, one schedule:
# staging (the shared content DB) and production (bp-portfolio-prod).
# The nightly connection doubles as the free-tier keep-alive for BOTH
# projects (a free Supabase project pauses after ~7 idle days).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL          — STAGING session-mode pooler string (port 5432,
#                              username postgres.<project-ref>). Copy it whole
#                              from the Supabase Connect dialog — never
#                              hand-assemble.
#   BACKUP_PASSPHRASE        — staging symmetric encryption key
#                              (e.g. `openssl rand -hex 32`). Keep a copy in
#                              the password manager: without it the backups
#                              are unreadable.
#   SUPABASE_DB_URL_PROD     — PRODUCTION session-mode pooler string.
#   BACKUP_PASSPHRASE_PROD   — production encryption key. Fresh value — never
#                              reuse the staging passphrase.
#
# Restore (locally — use the passphrase matching the artifact's target):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in db-<target>-YYYY-MM-DD.dump.enc -out db.dump -pass env:BACKUP_PASSPHRASE
#   pg_restore --clean --if-exists --no-owner --no-privileges \
#     -d "$TARGET_DB_URL" db.dump
#
# Notes:
# - This repo is public: dumps contain drafts, gated content, and contact
#   emails, so the artifacts MUST stay encrypted. Never upload the plaintext.
# - pg_dump major version must match the server (Postgres 17), hence the
#   PGDG client install.
# - GitHub disables cron workflows after 60 days without repo activity;
#   the run-summary line makes silent failure visible in the Actions tab.
# - min_bytes: staging holds real content (100KB floor). Production was empty
#   until the merge-day promotion; post-promotion (2026-08-23) its floor is
#   1MB, which asserts real content arrived — an empty Supabase DB still dumps
#   ~210KB of platform-schema DDL, so a smaller floor wouldn't catch a
#   content-less dump.

name: db-backup

on:
  schedule:
    - cron: '17 9 * * *' # daily 09:17 UTC (~02:17 PT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one target's failure must not cancel the other's backup
      matrix:
        include:
          - target: staging
            url_secret: SUPABASE_DB_URL
            pass_secret: BACKUP_PASSPHRASE
            min_bytes: 100000
          - target: prod
            url_secret: SUPABASE_DB_URL_PROD
            pass_secret: BACKUP_PASSPHRASE_PROD
            min_bytes: 1000000 # post-promotion: real content present (~2.4MB dumps); 1MB floor asserts content arrived, above the ~210KB empty-schema baseline
    name: dump (${{ matrix.target }})
    steps:
      - name: Install postgresql-client-17 (matches server 17.6)
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database (${{ matrix.target }})
        env:
          DB_URL: ${{ secrets[matrix.url_secret] }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "::error::${{ matrix.url_secret }} secret is not set"; exit 1; }
          # runner preinstalls pg 16 client tools which shadow the pg17 install
          # on PATH — invoke the versioned binary explicitly
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges -f db.dump
          # sanity: an empty/failed dump is worse than a loud failure
          size=$(stat -c%s db.dump)
          echo "dump size: ${size} bytes"
          test "$size" -gt ${{ matrix.min_bytes }} || { echo "::error::dump suspiciously small (${size} bytes, floor ${{ matrix.min_bytes }})"; exit 1; }

      - name: Encrypt dump (${{ matrix.target }})
        env:
          PASSPHRASE: ${{ secrets[matrix.pass_secret] }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE" || { echo "::error::${{ matrix.pass_secret }} secret is not set"; exit 1; }
          stamp=$(date -u +%Y-%m-%d)
          out="db-${{ matrix.target }}-${stamp}.dump.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in db.dump -out "$out" -pass env:PASSPHRASE
          shred -u db.dump
          echo "ARTIFACT_FILE=${out}" >> "$GITHUB_ENV"
          echo "Encrypted backup: ${out} ($(stat -c%s "$out") bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted artifact (14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_FILE }}
          path: ${{ env.ARTIFACT_FILE }}
          retention-days: 14
          if-no-files-found: error
