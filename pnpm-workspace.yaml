# pnpm settings (pnpm 11 reads these from pnpm-workspace.yaml, not package.json)
packages:
  - '.'
overrides:
  prismjs: 1.30.0
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  # Security advisories (wave-1 post-launch prod-health, #4) — patch/minor
  # bumps only, no major jumps. Version-scoped where two majors coexist so a
  # bump can't cross a major boundary and break the consumer.
  'undici@6': '^6.28.0' # @vercel/blob path (prod)
  'undici@7': '^7.29.0' # payload path (prod)
  nanoid: '^3.3.18'
  mermaid: '^11.16.1' # streamdown (prod)
  js-yaml: '^4.3.1'
  'fast-uri@3': '^3.1.5'
  'fast-uri@4': '^4.1.2'
  # image-size: advisory (ICNS/JXL/HEIF parser DoS) has NO released fix — latest
  # is 2.0.2; revisit when >=2.0.3 ships. Reachable via payload (prod) for media
  # dimension detection, but only exploitable by an authenticated admin uploading
  # a crafted ICNS/JXL/HEIF file — low practical risk. Tracked, not yet fixable.
  ip-address: '^10.3.1'
  dompurify: '^3.4.13'
  postcss: '^8.5.23'
  hono: '^4.12.34' # @payloadcms/plugin-mcp path (prod)
  '@hono/node-server': '^1.19.15'
  valibot: '^1.4.2' # Storybook MCP addon (dev)
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@5': '^5.0.9'
  # better-sqlite3: evalite's results DB. v11 uses the NAN-style ObjectWrap
  # pattern, which aborts node at worker-thread teardown ("Assertion failed:
  # (env) != nullptr" in RemoveEnvironmentCleanupHook, exit 134) — measured
  # twice on PR #123's Evalite CI job, AFTER the evals had already passed, on
  # both Node 24.20 and pinned 24.18. v13 migrated to N-API (13.0.0) and
  # explicitly "fixed process aborting from terminating worker threads"
  # (13.0.2). Major jump, but the consumer surface is evalite's internal DB
  # only — nothing in src/ imports it.
  better-sqlite3: '^13.0.3'
allowBuilds:
  '@sentry/cli': true
  autoevals: true
  # better-sqlite3: v13 ships per-platform prebuilds inside the npm package
  # (gypfile: false) — nothing needs building, so its build script stays
  # disallowed. v11 needed this true.
  better-sqlite3: false
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11
  - '@next/eslint-plugin-next@16.2.11'
  - eslint-config-next@16.2.11
  - '@ai-sdk/anthropic@3.0.100'
  - '@ai-sdk/gateway@3.0.156'
  - '@ai-sdk/openai@3.0.87'
  - '@ai-sdk/react@3.0.236'
  - ai@6.0.234
  - '@clerk/nextjs@7.5.22'
