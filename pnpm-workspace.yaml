# pnpm settings (pnpm 11 reads these from pnpm-workspace.yaml, not package.json)
packages:
  - '.'
overrides:
  prismjs: 1.30.0
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  # Security advisories (wave-1 post-launch prod-health, #4) — patch/minor
  # bumps only, no major jumps, with one exception: @hono/node-server moved
  # 1.x -> 2.x on 2026-11-15, inside every requester's declared range (its
  # comment below). Version-scoped where two majors coexist so a bump can't
  # cross a major boundary and break the consumer.
  'undici@6': '^6.29.1' # @vercel/blob path (prod)
  # undici@7: exactly payload's own pin. Payload 3.91.0 pins exactly 7.29.1,
  # so this entry names that version and no range: a caret here would resolve
  # past the pin on a fresh resolve. The 7.30.1 fixes arrive with Payload
  # >=3.92, which pins 7.30.1 itself but needs Node >=24.22.1 (CI: 24.18.0).
  'undici@7': '7.29.1' # payload path (prod)
  nanoid: '^3.3.18'
  mermaid: '^11.16.1' # streamdown (prod)
  js-yaml: '^4.3.1'
  'fast-uri@3': '^3.1.9'
  'fast-uri@4': '^4.2.3'
  # image-size (#100): no override needed, and none is set — the package is no
  # longer in the tree (Payload 3.87 moved to image-dimensions, Storybook
  # 10.6.7 to probe-image-size; docs/DEPENDENCIES.md). This says nothing about
  # the advisory records' state, which is read from GitHub.
  ip-address: '^10.7.4'
  # dompurify also crosses an exact pin: monaco-editor 0.56.0 (Payload's code
  # field) declares exactly 3.4.8. That crossing predates the 2026-11-15
  # Dependabot lane, which only raised the floor from ^3.4.13.
  dompurify: '^3.4.17'
  postcss: '^8.5.23'
  # lightningcss: pinned DOWN to the version @tailwindcss/node@4.3.3 hard-pins
  # (exactly 1.32.0). vite@8.1.5 declares `lightningcss: ^1.32.0`, and the
  # webpack minimizer takes it as an optional `*` peer — both are satisfied by
  # 1.32.0, so this override picks a version already inside every declared
  # range rather than pinning over a conflict. It is load-bearing for
  # durability, not satisfiability: without it a FROM-SCRATCH resolve (deleted
  # lockfile) resolves those ranges to the newest release again and the tree
  # carries two copies of a statically linked native addon (#195). An
  # incremental `pnpm install` does NOT bring the duplicate back, so testing
  # this entry by re-running install will make it look inert — it is not.
  # Drop it once @tailwindcss/postcss ships a release that moves off 1.32.0.
  lightningcss: 1.32.0
  hono: '^4.13.16' # @payloadcms/plugin-mcp path (prod)
  # @modelcontextprotocol/sdk (#312, #258): the one override here that
  # crosses an exact pin by Brandon's decision (dompurify, above, crosses
  # one too, with no recorded decision). @payloadcms/plugin-mcp 3.90.2 pins the SDK at
  # exactly 1.30.0, and mcp-handler 1.1.0 wants exactly 1.26.0; both are
  # affected by six advisories (GHSA-f897-62hf-6gxq, -6qxp-vccf-f47h,
  # -46jr-4wx8-v453, -rvq5-wwqv-78pq, -6prh-2h8m-c8cw, -22jm-h49p-29qw),
  # fixed in 1.32.0. docs/SECURITY.md's "never force-overridden" rule is
  # waived for this entry only, by Brandon on 2026-11-14. 1.32.2 is
  # same-major; typecheck, the MCP plugin tests and the real-Postgres
  # POST /api/mcp test pass on it. Exit: drop this entry as soon as a
  # Payload release pins 1.32.x or later. Check with
  #   pnpm view @payloadcms/plugin-mcp@<version> dependencies
  # @spotlightjs/spotlight bundles its own SDK copy, out of this override's
  # reach; 4.12.1 bundles 1.32.0 (docs/DEPENDENCIES.md, Spotlight entry).
  '@modelcontextprotocol/sdk': 1.32.2
  # @hono/node-server: 2.x since the 2026-11-15 Dependabot lane. The SDK
  # declares `^1.19.9 || ^2.0.5` and Spotlight 4.12.1 `^2.0.10`, so 2.1.3+
  # sits inside both; the old ^1.19.15 floor forced Spotlight below its range.
  '@hono/node-server': '^2.1.3'
  valibot: '^1.4.2' # Storybook MCP addon (dev)
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@5': '^5.0.12'
  # Dependabot lane, 2026-11-15: patch/minor floors, each inside every
  # requester's declared range (read from node_modules at 3.90.2).
  fastify: '^5.12.2' # evalite (dev)
  body-parser: '^2.4.0' # express via plugin-mcp (prod)
  proxy-addr: '^2.0.8' # express via plugin-mcp (prod)
  qs: '^6.16.1' # express, body-parser (prod)
  shell-quote: '^1.11.0' # launch-editor via Spotlight (dev)
  source-map-js: '^1.2.2' # postcss, tailwind (build)
  fast-copy: '^3.1.0' # pino-pretty via payload (prod)
  'happy-dom@20': '^20.14.6' # @lexical/headless, vitest peer
  'vite@8': '~8.1.6' # vitest, storybook (dev); ~ keeps lightningcss 1.32.0 valid
  # browserslist (#232, 2026-09-26): floor at the patched release for
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g (High ×2, <4.28.7). Build-time
  # only (@babel/helper-compilation-targets ^4.24.0, webpack ^4.24.0). Every
  # requester's range already admits the fix, but `pnpm update browserslist`
  # (and `pnpm update 'browserslist@^4.28.7'`) left 4.28.6 in the lockfile, so
  # this override is the lever pnpm leaves us: pnpm will not move an in-range
  # version on its own (the same behaviour #195 hit with lightningcss, above).
  # It stays inside every declared range.
  # Drop it once a from-scratch resolve lands >=4.28.7 without it.
  browserslist: '^4.28.7'
  # better-sqlite3: evalite's results DB. v11 uses the NAN-style ObjectWrap
  # pattern, which aborts node at worker-thread teardown ("Assertion failed:
  # (env) != nullptr" in RemoveEnvironmentCleanupHook, exit 134) — measured
  # twice on PR #123's Evalite CI job, AFTER the evals had already passed, on
  # both Node 24.20 and pinned 24.18. v13 migrated to N-API (13.0.0) and
  # explicitly "fixed process aborting from terminating worker threads"
  # (13.0.2). Major jump, but the consumer surface is evalite's internal DB
  # only — nothing in src/ imports it.
  better-sqlite3: '^13.0.3'
allowBuilds:
  '@sentry/cli': true
  autoevals: true
  # better-sqlite3: v13 ships per-platform prebuilds inside the npm package
  # (gypfile: false) — nothing needs building, so its build script stays
  # disallowed. v11 needed this true.
  better-sqlite3: false
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Release-age gate (#222, 2026-09-26): pnpm refuses to resolve any version
# published less than this many MINUTES ago (1440 = 1 day). It applies when a
# version is resolved (add/update/an install that re-resolves), not to a
# frozen-lockfile install of versions already locked. Before 2026-09-26 the
# key was absent and the exclude list below guarded nothing. An entry below is
# a deliberate, documented exception — add one only with a reason (e.g. a
# same-day security patch), never to silence the gate.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - next@16.2.11
  - '@next/eslint-plugin-next@16.2.11'
  - eslint-config-next@16.2.11
  - '@ai-sdk/anthropic@3.0.100'
  - '@ai-sdk/gateway@3.0.156'
  - '@ai-sdk/openai@3.0.87'
  - '@ai-sdk/react@3.0.236'
  - ai@6.0.234
  - '@clerk/nextjs@7.5.22'
