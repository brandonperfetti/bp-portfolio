<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: sky (Next.js / frontend architecture) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 52% 46%,
            rgba(3, 105, 161, 0.28),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 24% 82%,
            rgba(3, 105, 161, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="pinGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#38bdf8" />
            <stop offset="1" stop-color="#52525b" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="300" cy="230" r="4" />
          <circle cx="1780" cy="190" r="4" />
          <circle cx="1660" cy="940" r="4" />
          <circle cx="250" cy="860" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 620 150 h 26 M 633 137 v 26" />
          <path d="M 140 600 h 24 M 152 588 v 24" />
          <path d="M 1910 700 h 24 M 1922 688 v 24" />
        </g>

        <!-- ===== the orbit: dotted renewal ring around the whole stack ===== -->
        <ellipse
          cx="1060"
          cy="560"
          rx="640"
          ry="380"
          fill="none"
          stroke="rgba(255,255,255,0.12)"
          stroke-width="3"
          stroke-dasharray="3 14"
          stroke-linecap="round"
        />
        <!-- renewal packet on the orbit, with heading tick -->
        <g transform="translate(1560,320)" filter="url(#accentGlow)">
          <circle r="10" fill="#38bdf8" />
          <path d="M 26 -18 L 54 -34 L 44 -2 Z" fill="rgba(56,189,248,0.7)" />
        </g>

        <!-- ===== the stack: four isometric plates, foundation alive ===== -->
        <!-- plate 4 (top): faintest — the app of the day -->
        <g transform="translate(1060,220)">
          <path
            d="M 0 -96 L 340 0 L 0 96 L -340 0 Z"
            fill="rgba(255,255,255,0.02)"
            stroke="rgba(255,255,255,0.16)"
            stroke-width="3"
          />
        </g>
        <!-- pins 4->3 -->
        <g
          stroke="rgba(255,255,255,0.14)"
          stroke-width="3.5"
          stroke-linecap="round"
        >
          <line x1="820" y1="248" x2="820" y2="392" />
          <line x1="1300" y1="248" x2="1300" y2="392" />
        </g>
        <!-- plate 3 -->
        <g transform="translate(1060,420)">
          <path
            d="M 0 -96 L 340 0 L 0 96 L -340 0 Z"
            fill="rgba(255,255,255,0.02)"
            stroke="rgba(255,255,255,0.24)"
            stroke-width="3.5"
          />
          <path
            d="M 0 -58 L 206 0 L 0 58 L -206 0 Z"
            fill="none"
            stroke="rgba(255,255,255,0.10)"
            stroke-width="3"
          />
        </g>
        <!-- pins 3->2 -->
        <g
          stroke="rgba(255,255,255,0.20)"
          stroke-width="3.5"
          stroke-linecap="round"
        >
          <line x1="800" y1="443" x2="800" y2="601" />
          <line x1="1320" y1="443" x2="1320" y2="601" />
        </g>
        <!-- plate 2 -->
        <g transform="translate(1060,624)">
          <path
            d="M 0 -96 L 340 0 L 0 96 L -340 0 Z"
            fill="rgba(255,255,255,0.03)"
            stroke="rgba(255,255,255,0.32)"
            stroke-width="3.5"
          />
          <path
            d="M 0 -58 L 206 0 L 0 58 L -206 0 Z"
            fill="none"
            stroke="rgba(255,255,255,0.14)"
            stroke-width="3"
          />
        </g>
        <!-- pins 2->1: charging up from the foundation -->
        <g stroke="url(#pinGrad)" stroke-width="4.5" stroke-linecap="round">
          <line x1="790" y1="644" x2="790" y2="812" />
          <line x1="1330" y1="644" x2="1330" y2="812" />
        </g>
        <!-- plate 1 (foundation): bright sky, the layer worth reusing -->
        <g transform="translate(1060,832)" filter="url(#bigGlow)">
          <path
            d="M 0 -96 L 340 0 L 0 96 L -340 0 Z"
            fill="rgba(3,105,161,0.16)"
            stroke="#38bdf8"
            stroke-width="5"
          />
          <path
            d="M 0 -58 L 206 0 L 0 58 L -206 0 Z"
            fill="rgba(3,105,161,0.10)"
            stroke="rgba(56,189,248,0.5)"
            stroke-width="3"
          />
          <circle r="12" fill="#38bdf8" />
        </g>
        <!-- vias on the foundation edge -->
        <g fill="#38bdf8" filter="url(#accentGlow)">
          <circle cx="790" cy="812" r="7" />
          <circle cx="1330" cy="812" r="7" />
        </g>

        <!-- ===== plug-in module (left): swappable part approaching its slot ===== -->
        <g transform="translate(380,560)">
          <rect
            x="-96"
            y="-72"
            width="192"
            height="144"
            rx="18"
            fill="rgba(255,255,255,0.02)"
            stroke="rgba(255,255,255,0.30)"
            stroke-width="3.5"
          />
          <g
            stroke="rgba(255,255,255,0.30)"
            stroke-width="3.5"
            stroke-linecap="round"
          >
            <line x1="96" y1="-36" x2="132" y2="-36" />
            <line x1="96" y1="0" x2="132" y2="0" />
            <line x1="96" y1="36" x2="132" y2="36" />
          </g>
          <circle
            r="22"
            fill="none"
            stroke="rgba(255,255,255,0.20)"
            stroke-width="3"
          />
        </g>
        <!-- its trace to the stack -->
        <path
          d="M 512 560 H 590 Q 610 560 610 580 V 624 Q 610 644 630 644 H 728"
          fill="none"
          stroke="rgba(56,189,248,0.45)"
          stroke-width="4.5"
          stroke-linecap="round"
        />
        <circle cx="610" cy="580" r="6" fill="rgba(56,189,248,0.7)" />
        <circle
          cx="728"
          cy="644"
          r="8"
          fill="#38bdf8"
          filter="url(#accentGlow)"
        />

        <!-- ===== retired module (bottom left): unplugged, drifting out, dashed ===== -->
        <g transform="translate(300,900) rotate(-8)">
          <rect
            x="-72"
            y="-52"
            width="144"
            height="104"
            rx="14"
            fill="none"
            stroke="rgba(255,255,255,0.14)"
            stroke-width="3"
            stroke-dasharray="4 12"
          />
          <line
            x1="-36"
            y1="-16"
            x2="36"
            y2="-16"
            stroke="rgba(255,255,255,0.10)"
            stroke-width="3"
            stroke-linecap="round"
          />
          <line
            x1="-36"
            y1="14"
            x2="10"
            y2="14"
            stroke="rgba(255,255,255,0.07)"
            stroke-width="3"
            stroke-linecap="round"
          />
        </g>

        <!-- ground shadow -->
        <ellipse
          cx="1060"
          cy="985"
          rx="330"
          ry="26"
          fill="rgba(3,105,161,0.14)"
        />
        <ellipse cx="380" cy="700" rx="130" ry="18" fill="rgba(0,0,0,0.45)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
