<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: sky (React/Next & frontend patterns) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 46%,
            rgba(3, 105, 161, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 80% 78%,
            rgba(3, 105, 161, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient
            id="fadeAway"
            gradientUnits="userSpaceOnUse"
            x1="0"
            y1="560"
            x2="0"
            y2="1010"
          >
            <stop offset="0" stop-color="rgba(56,189,248,0.5)" />
            <stop offset="1" stop-color="rgba(56,189,248,0.02)" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="305" cy="195" r="4" />
          <circle cx="1795" cy="185" r="4" />
          <circle cx="1745" cy="955" r="4" />
          <circle cx="235" cy="905" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 1545 145 h 26 M 1558 132 v 26" />
          <path d="M 155 455 h 24 M 167 443 v 24" />
          <path d="M 1915 665 h 24 M 1927 653 v 24" />
        </g>

        <!-- ===== LEFT: infinite scroll — the bottomless feed ===== -->
        <g transform="translate(560,0)">
          <!-- viewport frame, open-bottomed -->
          <path
            d="M -240 180 H 240 V 980"
            fill="none"
            stroke="rgba(56,189,248,0.5)"
            stroke-width="5"
            stroke-linecap="round"
          />
          <path
            d="M -240 180 V 980"
            fill="none"
            stroke="rgba(56,189,248,0.5)"
            stroke-width="5"
            stroke-linecap="round"
          />
          <!-- cards: crisp at top, dissolving down forever -->
          <g>
            <rect
              x="-200"
              y="230"
              width="400"
              height="110"
              rx="16"
              fill="rgba(9,9,11,0.88)"
              stroke="#38bdf8"
              stroke-width="4"
              filter="url(#accentGlow)"
            />
            <circle cx="-150" cy="285" r="24" fill="rgba(56,189,248,0.35)" />
            <rect
              x="-106"
              y="262"
              width="240"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.5)"
            />
            <rect
              x="-106"
              y="292"
              width="180"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.18)"
            />
          </g>
          <g opacity="0.8">
            <rect
              x="-200"
              y="370"
              width="400"
              height="110"
              rx="16"
              fill="rgba(9,9,11,0.85)"
              stroke="rgba(56,189,248,0.6)"
              stroke-width="3.5"
            />
            <circle cx="-150" cy="425" r="24" fill="rgba(56,189,248,0.28)" />
            <rect
              x="-106"
              y="402"
              width="220"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.4)"
            />
            <rect
              x="-106"
              y="432"
              width="160"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.14)"
            />
          </g>
          <g opacity="0.55">
            <rect
              x="-200"
              y="510"
              width="400"
              height="110"
              rx="16"
              fill="rgba(9,9,11,0.8)"
              stroke="rgba(56,189,248,0.45)"
              stroke-width="3.5"
            />
            <rect
              x="-106"
              y="542"
              width="200"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.3)"
            />
            <rect
              x="-106"
              y="572"
              width="150"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.1)"
            />
          </g>
          <g opacity="0.35">
            <rect
              x="-200"
              y="650"
              width="400"
              height="110"
              rx="16"
              fill="rgba(9,9,11,0.75)"
              stroke="rgba(56,189,248,0.3)"
              stroke-width="3"
            />
          </g>
          <g opacity="0.2">
            <rect
              x="-200"
              y="790"
              width="400"
              height="110"
              rx="16"
              fill="rgba(9,9,11,0.7)"
              stroke="rgba(56,189,248,0.2)"
              stroke-width="3"
            />
          </g>
          <rect
            x="-200"
            y="920"
            width="400"
            height="80"
            rx="16"
            fill="url(#fadeAway)"
            opacity="0.14"
          />
          <!-- scrollbar: tiny thumb, huge track — you'll never reach the end -->
          <line
            x1="270"
            y1="220"
            x2="270"
            y2="960"
            stroke="rgba(255,255,255,0.12)"
            stroke-width="8"
            stroke-linecap="round"
          />
          <rect
            x="262"
            y="240"
            width="16"
            height="54"
            rx="8"
            fill="#38bdf8"
            filter="url(#accentGlow)"
          />
          <!-- loading spinner ghost at the vanishing point -->
          <g transform="translate(0,940)" opacity="0.5">
            <path
              d="M 0 -22 A 22 22 0 1 1 -21 7"
              fill="none"
              stroke="rgba(56,189,248,0.6)"
              stroke-width="4"
              stroke-linecap="round"
            />
          </g>
        </g>

        <!-- ===== center divider ===== -->
        <path
          d="M 1024 240 V 900"
          stroke="rgba(255,255,255,0.14)"
          stroke-width="3.5"
          stroke-dasharray="4 18"
          stroke-linecap="round"
        />

        <!-- ===== RIGHT: pagination — bounded pages, solid ground ===== -->
        <g transform="translate(1490,0)">
          <!-- closed viewport frame -->
          <rect
            x="-240"
            y="180"
            width="480"
            height="620"
            rx="20"
            fill="none"
            stroke="rgba(56,189,248,0.5)"
            stroke-width="5"
          />
          <!-- exactly three cards, all crisp -->
          <g>
            <rect
              x="-200"
              y="240"
              width="400"
              height="150"
              rx="16"
              fill="rgba(9,9,11,0.88)"
              stroke="#38bdf8"
              stroke-width="4"
            />
            <circle cx="-150" cy="315" r="26" fill="rgba(56,189,248,0.35)" />
            <rect
              x="-102"
              y="284"
              width="240"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.5)"
            />
            <rect
              x="-102"
              y="314"
              width="180"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.18)"
            />
            <rect
              x="-102"
              y="344"
              width="210"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.12)"
            />
          </g>
          <g>
            <rect
              x="-200"
              y="420"
              width="400"
              height="150"
              rx="16"
              fill="rgba(9,9,11,0.88)"
              stroke="#38bdf8"
              stroke-width="4"
            />
            <circle cx="-150" cy="495" r="26" fill="rgba(56,189,248,0.35)" />
            <rect
              x="-102"
              y="464"
              width="220"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.5)"
            />
            <rect
              x="-102"
              y="494"
              width="160"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.18)"
            />
            <rect
              x="-102"
              y="524"
              width="190"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.12)"
            />
          </g>
          <g>
            <rect
              x="-200"
              y="600"
              width="400"
              height="150"
              rx="16"
              fill="rgba(9,9,11,0.88)"
              stroke="#38bdf8"
              stroke-width="4"
            />
            <circle cx="-150" cy="675" r="26" fill="rgba(56,189,248,0.35)" />
            <rect
              x="-102"
              y="644"
              width="230"
              height="12"
              rx="6"
              fill="rgba(56,189,248,0.5)"
            />
            <rect
              x="-102"
              y="674"
              width="170"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.18)"
            />
            <rect
              x="-102"
              y="704"
              width="200"
              height="12"
              rx="6"
              fill="rgba(255,255,255,0.12)"
            />
          </g>
          <!-- page controls beneath: prev · 1 2 3 · next; page 2 current -->
          <g transform="translate(0,880)">
            <path
              d="M -196 0 l -18 0 M -206 -9 l -9 9 l 9 9"
              fill="none"
              stroke="rgba(56,189,248,0.5)"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="-100"
              cy="0"
              r="26"
              fill="rgba(9,9,11,0.85)"
              stroke="rgba(56,189,248,0.4)"
              stroke-width="3.5"
            />
            <circle cx="-100" cy="0" r="6" fill="rgba(56,189,248,0.4)" />
            <circle
              cx="0"
              cy="0"
              r="30"
              fill="rgba(3,105,161,0.35)"
              stroke="#38bdf8"
              stroke-width="4.5"
              filter="url(#accentGlow)"
            />
            <circle cx="0" cy="0" r="8" fill="#38bdf8" />
            <circle
              cx="100"
              cy="0"
              r="26"
              fill="rgba(9,9,11,0.85)"
              stroke="rgba(56,189,248,0.4)"
              stroke-width="3.5"
            />
            <circle cx="100" cy="0" r="6" fill="rgba(56,189,248,0.4)" />
            <path
              d="M 178 0 l 18 0 M 188 -9 l 9 9 l -9 9"
              fill="none"
              stroke="rgba(56,189,248,0.5)"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
        </g>

        <!-- ground shadows: only the paginated side has firm footing -->
        <ellipse cx="1490" cy="990" rx="330" ry="24" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="560" cy="1010" rx="300" ry="18" fill="rgba(0,0,0,0.25)" />
        <ellipse
          cx="1490"
          cy="950"
          rx="220"
          ry="14"
          fill="rgba(3,105,161,0.12)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
