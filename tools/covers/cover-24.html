<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: sky (React/Next & frontend patterns) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 40% 46%,
            rgba(3, 105, 161, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 84% 66%,
            rgba(3, 105, 161, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="310" cy="190" r="4" />
          <circle cx="1800" cy="180" r="4" />
          <circle cx="1745" cy="945" r="4" />
          <circle cx="225" cy="905" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1542 148 h 26 M 1555 135 v 26" />
          <path d="M 156 448 h 24 M 168 436 v 24" />
          <path d="M 1924 654 h 24 M 1936 642 v 24" />
        </g>

        <!-- ===== the UI: already updated, instantly lit ===== -->
        <g transform="translate(620,540)">
          <rect x="-320" y="-300" width="640" height="600" rx="26"
            fill="rgba(9,9,11,0.88)" stroke="#38bdf8" stroke-width="5" filter="url(#bigGlow)" />
          <line x1="-320" y1="-220" x2="320" y2="-220" stroke="rgba(56,189,248,0.3)"
            stroke-width="3.5" />
          <circle cx="-280" cy="-260" r="9" fill="rgba(56,189,248,0.5)" />
          <rect x="-252" y="-269" width="130" height="18" rx="9" fill="rgba(255,255,255,0.14)" />

          <!-- settled list rows -->
          <g>
            <rect x="-280" y="-180" width="560" height="80" rx="14"
              fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.16)" stroke-width="3" />
            <circle cx="-236" cy="-140" r="16" fill="rgba(56,189,248,0.35)" />
            <rect x="-196" y="-152" width="240" height="12" rx="6" fill="rgba(255,255,255,0.2)" />
          </g>
          <g>
            <rect x="-280" y="-80" width="560" height="80" rx="14"
              fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.16)" stroke-width="3" />
            <circle cx="-236" cy="-40" r="16" fill="rgba(56,189,248,0.35)" />
            <rect x="-196" y="-52" width="200" height="12" rx="6" fill="rgba(255,255,255,0.2)" />
          </g>
          <!-- THE optimistic row: just appeared, glowing, heart already filled -->
          <g>
            <rect x="-280" y="20" width="560" height="80" rx="14"
              fill="rgba(3,105,161,0.3)" stroke="#38bdf8" stroke-width="4.5"
              filter="url(#accentGlow)" />
            <circle cx="-236" cy="60" r="16" fill="rgba(56,189,248,0.6)" />
            <rect x="-196" y="48" width="270" height="12" rx="6" fill="rgba(56,189,248,0.55)" />
            <!-- filled heart: the like that hasn't reached the server yet -->
            <path d="M 236 44 c -8 -12, -26 -10, -28 4 c -2 12, 12 22, 28 32 c 16 -10, 30 -20, 28 -32 c -2 -14, -20 -16, -28 -4 z"
              fill="#38bdf8" filter="url(#accentGlow)" />
          </g>
          <!-- instant tap ripple -->
          <circle cx="236" cy="60" r="34" fill="none" stroke="rgba(56,189,248,0.35)"
            stroke-width="3" />
          <circle cx="236" cy="60" r="50" fill="none" stroke="rgba(56,189,248,0.18)"
            stroke-width="3" />

          <!-- tiny in-flight pip on the new row -->
          <circle cx="256" cy="112" r="6" fill="rgba(56,189,248,0.5)" />
        </g>

        <!-- ===== the round trip: request racing to the server behind the scenes ===== -->
        <path d="M 950 420 C 1150 340, 1350 320, 1520 350" fill="none"
          stroke="rgba(56,189,248,0.45)" stroke-width="4.5" stroke-linecap="round"
          stroke-dasharray="16 14" />
        <circle cx="1240" cy="342" r="9" fill="#38bdf8" filter="url(#accentGlow)" />
        <!-- confirmation returning -->
        <path d="M 1540 480 C 1380 540, 1180 560, 990 540" fill="none"
          stroke="rgba(56,189,248,0.35)" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="3 12" />
        <path d="M 1014 522 L 978 542 L 1010 562 Z" fill="rgba(56,189,248,0.6)" />

        <!-- the server -->
        <g transform="translate(1680,420)">
          <rect x="-100" y="-130" width="200" height="260" rx="20"
            fill="rgba(9,9,11,0.9)" stroke="#38bdf8" stroke-width="5" filter="url(#bigGlow)" />
          <g stroke="rgba(56,189,248,0.5)" stroke-width="4.5" stroke-linecap="round">
            <line x1="-58" y1="-70" x2="58" y2="-70" />
            <line x1="-58" y1="-10" x2="58" y2="-10" />
            <line x1="-58" y1="50" x2="58" y2="50" />
          </g>
          <g fill="#38bdf8">
            <circle cx="66" cy="-70" r="6" />
            <circle cx="66" cy="-10" r="6" />
          </g>
          <!-- confirmation check stamped on the server -->
          <g transform="translate(0,150)">
            <circle r="30" fill="rgba(9,9,11,0.9)" stroke="#38bdf8" stroke-width="4"
              filter="url(#accentGlow)" />
            <path d="M -13 2 l 9 10 l 19 -22" fill="none" stroke="#38bdf8" stroke-width="5"
              stroke-linecap="round" />
          </g>
        </g>

        <!-- ===== the rollback ghost: the undo path nobody sees unless it fails ===== -->
        <g transform="translate(620,930)" opacity="0.55">
          <path d="M -60 0 A 60 60 0 1 1 -18 58" fill="none"
            stroke="rgba(56,189,248,0.5)" stroke-width="4" stroke-linecap="round" />
          <path d="M -30 46 L -14 62 L -34 70 Z" fill="rgba(56,189,248,0.5)" />
          <!-- ghost row it would restore -->
          <rect x="60" y="-24" width="220" height="48" rx="12" fill="none"
            stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="10 10" />
        </g>

        <!-- stopwatch: perceived time, already done -->
        <g transform="translate(300,220)">
          <circle r="44" fill="rgba(9,9,11,0.88)" stroke="rgba(56,189,248,0.6)"
            stroke-width="4" />
          <line x1="0" y1="-56" x2="0" y2="-66" stroke="rgba(56,189,248,0.6)"
            stroke-width="5" stroke-linecap="round" />
          <path d="M 0 0 V -26" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
          <circle r="6" fill="#38bdf8" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1000" cy="1000" rx="620" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="620" cy="960" rx="280" ry="16" fill="rgba(3,105,161,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
