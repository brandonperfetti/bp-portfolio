<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: emerald (databases & infra) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 46%,
            rgba(13, 128, 106, 0.28),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 25% 80%,
            rgba(13, 128, 106, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <!-- userSpaceOnUse: the straight match line's bbox is degenerate -->
          <linearGradient
            id="matchGrad"
            gradientUnits="userSpaceOnUse"
            x1="582"
            y1="0"
            x2="1466"
            y2="0"
          >
            <stop offset="0" stop-color="#0d806a" />
            <stop offset="0.5" stop-color="#34d399" />
            <stop offset="1" stop-color="#0d806a" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="300" cy="170" r="4" />
          <circle cx="1830" cy="240" r="4" />
          <circle cx="1740" cy="950" r="4" />
          <circle cx="230" cy="900" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 1520 140 h 26 M 1533 127 v 26" />
          <path d="M 150 420 h 24 M 162 408 v 24" />
          <path d="M 1900 700 h 24 M 1912 688 v 24" />
        </g>

        <!-- ===== LEFT TABLE ===== -->
        <g transform="translate(430,576)">
          <rect
            x="-200"
            y="-300"
            width="400"
            height="600"
            rx="24"
            fill="rgba(9,9,11,0.85)"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="3.5"
          />
          <!-- header band -->
          <rect
            x="-200"
            y="-300"
            width="400"
            height="78"
            rx="24"
            fill="rgba(255,255,255,0.05)"
            stroke="none"
          />
          <line
            x1="-200"
            y1="-222"
            x2="200"
            y2="-222"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="3.5"
          />
          <!-- rows: bar + key dot on right edge -->
          <g stroke-linecap="round">
            <!-- row 1: matched -->
            <line
              x1="-150"
              y1="-160"
              x2="60"
              y2="-160"
              stroke="rgba(255,255,255,0.4)"
              stroke-width="9"
            />
            <circle
              cx="152"
              cy="-160"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <!-- row 2: matched -->
            <line
              x1="-150"
              y1="-62"
              x2="30"
              y2="-62"
              stroke="rgba(255,255,255,0.34)"
              stroke-width="9"
            />
            <circle
              cx="152"
              cy="-62"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <!-- row 3: unmatched (left-only) -->
            <line
              x1="-150"
              y1="36"
              x2="72"
              y2="36"
              stroke="rgba(255,255,255,0.14)"
              stroke-width="9"
            />
            <circle
              cx="152"
              cy="36"
              r="11"
              fill="none"
              stroke="rgba(255,255,255,0.25)"
              stroke-width="3.5"
            />
            <!-- row 4: matched -->
            <line
              x1="-150"
              y1="134"
              x2="48"
              y2="134"
              stroke="rgba(255,255,255,0.34)"
              stroke-width="9"
            />
            <circle
              cx="152"
              cy="134"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <!-- row 5: unmatched -->
            <line
              x1="-150"
              y1="232"
              x2="20"
              y2="232"
              stroke="rgba(255,255,255,0.14)"
              stroke-width="9"
            />
            <circle
              cx="152"
              cy="232"
              r="11"
              fill="none"
              stroke="rgba(255,255,255,0.25)"
              stroke-width="3.5"
            />
          </g>
        </g>

        <!-- ===== RIGHT TABLE ===== -->
        <g transform="translate(1618,576)">
          <rect
            x="-200"
            y="-300"
            width="400"
            height="600"
            rx="24"
            fill="rgba(9,9,11,0.85)"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="3.5"
          />
          <rect
            x="-200"
            y="-300"
            width="400"
            height="78"
            rx="24"
            fill="rgba(255,255,255,0.05)"
            stroke="none"
          />
          <line
            x1="-200"
            y1="-222"
            x2="200"
            y2="-222"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="3.5"
          />
          <g stroke-linecap="round">
            <!-- row 1: matched -->
            <circle
              cx="-152"
              cy="-160"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <line
              x1="-60"
              y1="-160"
              x2="150"
              y2="-160"
              stroke="rgba(255,255,255,0.4)"
              stroke-width="9"
            />
            <!-- row 2: matched (crossing) -->
            <circle
              cx="-152"
              cy="-14"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <line
              x1="-60"
              y1="-14"
              x2="120"
              y2="-14"
              stroke="rgba(255,255,255,0.34)"
              stroke-width="9"
            />
            <!-- row 3: unmatched (right-only) -->
            <circle
              cx="-152"
              cy="84"
              r="11"
              fill="none"
              stroke="rgba(255,255,255,0.25)"
              stroke-width="3.5"
            />
            <line
              x1="-60"
              y1="84"
              x2="140"
              y2="84"
              stroke="rgba(255,255,255,0.14)"
              stroke-width="9"
            />
            <!-- row 4: matched -->
            <circle
              cx="-152"
              cy="182"
              r="11"
              fill="#34d399"
              filter="url(#accentGlow)"
            />
            <line
              x1="-60"
              y1="182"
              x2="100"
              y2="182"
              stroke="rgba(255,255,255,0.34)"
              stroke-width="9"
            />
          </g>
        </g>

        <!-- ===== MATCH LINES (the join, no Venn in sight) ===== -->
        <g fill="none" stroke-linecap="round">
          <!-- straight match -->
          <!-- no filter here: a flat path's bbox is degenerate, so the
               percentage-sized filter region collapses and hides the line -->
          <path
            d="M 582 416 C 800 420, 1250 412, 1466 416"
            stroke="url(#matchGrad)"
            stroke-width="6"
          />
          <!-- crossing match: left row2 -> right row2 (lower) -->
          <path
            d="M 582 514 C 850 514, 1200 562, 1466 562"
            stroke="url(#matchGrad)"
            stroke-width="6"
            opacity="0.85"
          />
          <!-- crossing match: left row4 -> right row4 -->
          <path
            d="M 582 710 C 850 710, 1200 758, 1466 758"
            stroke="url(#matchGrad)"
            stroke-width="6"
            opacity="0.85"
          />
          <!-- unmatched stubs: dashed, going nowhere -->
          <path
            d="M 582 612 h 130"
            stroke="rgba(255,255,255,0.18)"
            stroke-width="4.5"
            stroke-dasharray="4 16"
          />
          <path
            d="M 582 808 h 90"
            stroke="rgba(255,255,255,0.18)"
            stroke-width="4.5"
            stroke-dasharray="4 16"
          />
          <path
            d="M 1466 660 h -110"
            stroke="rgba(255,255,255,0.18)"
            stroke-width="4.5"
            stroke-dasharray="4 16"
          />
        </g>
        <!-- key match nodes at midpoints -->
        <g fill="#34d399" filter="url(#accentGlow)">
          <circle cx="1024" cy="416" r="9" />
          <circle cx="1024" cy="540" r="8" />
          <circle cx="1024" cy="736" r="8" />
        </g>

        <!-- ground shadows -->
        <ellipse cx="430" cy="912" rx="240" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1618" cy="912" rx="240" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse
          cx="1024"
          cy="880"
          rx="200"
          ry="18"
          fill="rgba(13,128,106,0.12)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
