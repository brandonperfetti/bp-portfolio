<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: amber (email / messaging) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 58% 40%,
            rgba(180, 83, 9, 0.26),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 26% 80%,
            rgba(180, 83, 9, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="mailGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#52525b" />
            <stop offset="0.5" stop-color="#d97706" />
            <stop offset="1" stop-color="#fbbf24" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="320" cy="190" r="4" />
          <circle cx="1760" cy="880" r="4" />
          <circle cx="1300" cy="150" r="4" />
          <circle cx="210" cy="900" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 900 160 h 26 M 913 147 v 26" />
          <path d="M 150 470 h 24 M 162 458 v 24" />
          <path d="M 1900 520 h 24 M 1912 508 v 24" />
        </g>

        <!-- ===== the $20 machine (left): oversized industrial mailer, dim = legacy ===== -->
        <g transform="translate(430,560)">
          <!-- dashed halo = already history -->
          <rect
            x="-260"
            y="-262"
            width="520"
            height="524"
            rx="34"
            fill="none"
            stroke="rgba(255,255,255,0.12)"
            stroke-width="3"
            stroke-dasharray="4 14"
          />
          <!-- main body -->
          <rect
            x="-216"
            y="-218"
            width="432"
            height="436"
            rx="26"
            fill="rgba(255,255,255,0.02)"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="3.5"
          />
          <!-- hopper on top -->
          <path
            d="M -110 -218 L -80 -290 H 80 L 110 -218"
            fill="rgba(255,255,255,0.03)"
            stroke="rgba(255,255,255,0.30)"
            stroke-width="3.5"
            stroke-linejoin="round"
          />
          <line
            x1="-80"
            y1="-290"
            x2="80"
            y2="-290"
            stroke="rgba(255,255,255,0.30)"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <!-- rivets -->
          <g fill="rgba(255,255,255,0.20)">
            <circle cx="-192" cy="-194" r="5" />
            <circle cx="192" cy="-194" r="5" />
            <circle cx="-192" cy="194" r="5" />
            <circle cx="192" cy="194" r="5" />
          </g>
          <!-- gauge: dial pinned high = overpaying -->
          <g transform="translate(-90,-90)">
            <circle
              r="62"
              fill="rgba(9,9,11,0.6)"
              stroke="rgba(255,255,255,0.30)"
              stroke-width="3.5"
            />
            <g
              stroke="rgba(255,255,255,0.22)"
              stroke-width="3"
              stroke-linecap="round"
            >
              <line x1="-44" y1="0" x2="-34" y2="0" />
              <line x1="-31" y1="-31" x2="-24" y2="-24" />
              <line x1="0" y1="-44" x2="0" y2="-34" />
              <line x1="31" y1="-31" x2="24" y2="-24" />
            </g>
            <line
              x1="0"
              y1="0"
              x2="34"
              y2="-26"
              stroke="rgba(255,255,255,0.45)"
              stroke-width="4"
              stroke-linecap="round"
            />
            <circle r="7" fill="rgba(255,255,255,0.40)" />
          </g>
          <!-- coin stack: the monthly bill, dim -->
          <g
            stroke="rgba(255,255,255,0.28)"
            stroke-width="3"
            fill="rgba(255,255,255,0.03)"
          >
            <ellipse cx="110" cy="150" rx="58" ry="16" />
            <ellipse cx="110" cy="122" rx="58" ry="16" />
            <ellipse cx="110" cy="94" rx="58" ry="16" />
          </g>
          <!-- inner conveyor lines -->
          <g
            stroke="rgba(255,255,255,0.14)"
            stroke-width="3"
            stroke-linecap="round"
          >
            <line x1="-160" y1="20" x2="20" y2="20" />
            <line x1="-160" y1="52" x2="-20" y2="52" />
          </g>
          <!-- big output flange on the right edge -->
          <g
            stroke="rgba(255,255,255,0.30)"
            stroke-width="3.5"
            stroke-linecap="round"
          >
            <line x1="216" y1="-90" x2="216" y2="-10" />
            <line x1="244" y1="-78" x2="244" y2="-22" />
          </g>
        </g>

        <!-- ===== the taper: fat legacy duct converging to one thin line ===== -->
        <g fill="none" stroke-linecap="round">
          <path
            d="M 676 470 C 800 470, 850 500, 950 512"
            stroke="rgba(255,255,255,0.22)"
            stroke-width="10"
          />
          <path
            d="M 676 510 C 790 512, 850 516, 950 518"
            stroke="rgba(255,255,255,0.16)"
            stroke-width="7"
          />
          <path
            d="M 676 550 C 800 548, 850 530, 950 524"
            stroke="rgba(255,255,255,0.10)"
            stroke-width="5"
          />
        </g>
        <!-- convergence node -->
        <circle
          cx="962"
          cy="518"
          r="10"
          fill="#fbbf24"
          filter="url(#accentGlow)"
        />

        <!-- ===== the single line: one API call, rising ===== -->
        <path
          d="M 962 518 C 1150 508, 1330 460, 1560 386"
          fill="none"
          stroke="url(#mailGrad)"
          stroke-width="6"
          stroke-linecap="round"
        />
        <!-- letters along the line become light -->
        <g fill="rgba(255,255,255,0.5)">
          <circle cx="1120" cy="507" r="6" />
        </g>
        <g fill="#fbbf24" filter="url(#accentGlow)">
          <circle cx="1300" cy="472" r="8" />
          <circle cx="1460" cy="422" r="9" />
        </g>

        <!-- ===== the paper plane: small, bright, already gone ===== -->
        <g transform="translate(1660,352) rotate(-14)" filter="url(#bigGlow)">
          <path
            d="M -96 34 L 118 -30 L -34 66 Z"
            fill="rgba(180,83,9,0.30)"
            stroke="#fbbf24"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <path
            d="M -34 66 L -20 12 L 118 -30"
            fill="none"
            stroke="#fbbf24"
            stroke-width="5"
            stroke-linejoin="round"
          />
        </g>
        <!-- speed trails behind the plane -->
        <g stroke="#fbbf24" stroke-linecap="round" filter="url(#accentGlow)">
          <line
            x1="1470"
            y1="440"
            x2="1548"
            y2="412"
            stroke-width="4"
            opacity="0.5"
          />
          <line
            x1="1430"
            y1="470"
            x2="1490"
            y2="450"
            stroke-width="3.5"
            opacity="0.3"
          />
        </g>
        <!-- destination ping (top right): delivered -->
        <g transform="translate(1900,240)">
          <circle r="10" fill="#fbbf24" filter="url(#accentGlow)" />
          <circle
            r="30"
            fill="none"
            stroke="rgba(251,191,36,0.35)"
            stroke-width="3"
          />
          <circle
            r="52"
            fill="none"
            stroke="rgba(251,191,36,0.15)"
            stroke-width="2.5"
          />
        </g>

        <!-- ground shadows -->
        <ellipse cx="430" cy="850" rx="250" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse
          cx="1660"
          cy="470"
          rx="130"
          ry="16"
          fill="rgba(180,83,9,0.14)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
