<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: indigo (engineering practice & architecture) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 50%,
            rgba(67, 56, 202, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 80% 22%,
            rgba(67, 56, 202, 0.12),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <linearGradient id="mainlineGrad" gradientUnits="userSpaceOnUse"
            x1="180" y1="0" x2="1900" y2="0">
            <stop offset="0" stop-color="#4338ca" />
            <stop offset="0.6" stop-color="#818cf8" />
            <stop offset="1" stop-color="#818cf8" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="300" cy="190" r="4" />
          <circle cx="1810" cy="210" r="4" />
          <circle cx="1740" cy="940" r="4" />
          <circle cx="220" cy="900" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1540 140 h 26 M 1553 127 v 26" />
          <path d="M 140 460 h 24 M 152 448 v 24" />
          <path d="M 1920 640 h 24 M 1932 628 v 24" />
        </g>

        <!-- ===== the mainline: code ships continuously ===== -->
        <path d="M 180 576 H 1900" stroke="url(#mainlineGrad)" stroke-width="6"
          fill="none" stroke-linecap="round" />
        <!-- deploy pulses on the mainline -->
        <g fill="#818cf8" filter="url(#accentGlow)">
          <circle cx="340" cy="576" r="8" />
          <circle cx="560" cy="576" r="8" />
        </g>

        <!-- ===== flag switch 1: ON — branch carries live traffic up ===== -->
        <g transform="translate(760,576)">
          <!-- toggle: pill with knob to the right (on) -->
          <rect x="-44" y="-92" width="88" height="44" rx="22"
            fill="rgba(67,56,202,0.3)" stroke="#818cf8" stroke-width="4" filter="url(#accentGlow)" />
          <circle cx="20" cy="-70" r="15" fill="#818cf8" />
          <!-- the enabled path: rises and rejoins -->
          <path d="M 0 0 C 60 0, 80 -160, 160 -160 H 420 C 500 -160, 520 0, 580 0"
            fill="none" stroke="#818cf8" stroke-width="5.5" stroke-linecap="round"
            filter="url(#accentGlow)" />
          <!-- cohort dots riding the new path -->
          <g fill="#818cf8">
            <circle cx="230" cy="-160" r="7" />
            <circle cx="330" cy="-160" r="7" />
          </g>
          <!-- percentage ramp ticks beside the branch -->
          <g stroke="rgba(129,140,248,0.5)" stroke-width="4" stroke-linecap="round">
            <line x1="150" y1="-208" x2="150" y2="-190" />
            <line x1="290" y1="-216" x2="290" y2="-190" />
            <line x1="430" y1="-224" x2="430" y2="-190" />
          </g>
        </g>

        <!-- ===== flag switch 2: OFF — dark branch waits below, code already shipped ===== -->
        <g transform="translate(1180,576)">
          <rect x="-44" y="48" width="88" height="44" rx="22"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
          <circle cx="-20" cy="70" r="15" fill="rgba(255,255,255,0.3)" />
          <!-- the dormant path: dips and rejoins, dashed -->
          <path d="M 0 0 C 60 0, 80 170, 160 170 H 380 C 460 170, 480 0, 540 0"
            fill="none" stroke="rgba(129,140,248,0.35)" stroke-width="4.5"
            stroke-linecap="round" stroke-dasharray="14 16" />
          <!-- sealed feature crate on the dark path -->
          <rect x="220" y="136" width="90" height="68" rx="14"
            fill="rgba(9,9,11,0.85)" stroke="rgba(129,140,248,0.4)" stroke-width="3.5" />
          <line x1="240" y1="170" x2="290" y2="170" stroke="rgba(129,140,248,0.35)"
            stroke-width="6" stroke-linecap="round" />
        </g>

        <!-- ===== kill switch: the emergency lever, poised but calm ===== -->
        <g transform="translate(1780,420)">
          <circle r="46" fill="rgba(9,9,11,0.88)" stroke="rgba(129,140,248,0.55)" stroke-width="4.5" />
          <line x1="0" y1="0" x2="26" y2="-26" stroke="#818cf8" stroke-width="6" stroke-linecap="round" />
          <circle r="8" fill="#818cf8" />
          <!-- dotted drop-line to the mainline: one flip away -->
          <path d="M 0 46 V 132" stroke="rgba(129,140,248,0.35)" stroke-width="3.5"
            stroke-dasharray="3 12" stroke-linecap="round" fill="none" />
        </g>

        <!-- observability strip under the mainline: cohort metrics ticking -->
        <g transform="translate(560,820)">
          <rect x="-200" y="-60" width="400" height="120" rx="18"
            fill="rgba(9,9,11,0.85)" stroke="rgba(255,255,255,0.3)" stroke-width="3.5" />
          <!-- two small bars: control vs treatment -->
          <rect x="-120" y="-6" width="90" height="36" rx="8" fill="rgba(255,255,255,0.14)" />
          <rect x="30" y="-26" width="90" height="56" rx="8" fill="rgba(129,140,248,0.55)" />
          <line x1="-140" y1="34" x2="140" y2="34" stroke="rgba(255,255,255,0.2)"
            stroke-width="3" stroke-linecap="round" />
        </g>
        <path d="M 760 700 C 700 740, 660 760, 620 764" fill="none"
          stroke="rgba(129,140,248,0.3)" stroke-width="3.5" stroke-dasharray="3 12"
          stroke-linecap="round" />

        <!-- ground shadow -->
        <ellipse cx="1024" cy="980" rx="560" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1000" cy="930" rx="240" ry="16" fill="rgba(67,56,202,0.14)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
