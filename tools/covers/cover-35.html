<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: amber (Node.js & APIs) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 46%,
            rgba(180, 83, 9, 0.26),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 80% 78%,
            rgba(180, 83, 9, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="290" cy="200" r="4" />
          <circle cx="1800" cy="190" r="4" />
          <circle cx="1730" cy="940" r="4" />
          <circle cx="240" cy="920" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1540 150 h 26 M 1553 137 v 26" />
          <path d="M 150 480 h 24 M 162 468 v 24" />
          <path d="M 1900 720 h 24 M 1912 708 v 24" />
        </g>

        <!-- ===== THE CONTRACT MONOLITH: one envelope every route honors ===== -->
        <g transform="translate(1024,560)">
          <!-- outer envelope -->
          <rect x="-300" y="-330" width="600" height="660" rx="34"
            fill="rgba(9,9,11,0.88)" stroke="#fbbf24" stroke-width="5"
            filter="url(#bigGlow)" />
          <rect x="-256" y="-286" width="512" height="572" rx="26" fill="none"
            stroke="rgba(251,191,36,0.28)" stroke-width="3" />
          <!-- data block -->
          <rect x="-212" y="-238" width="424" height="230" rx="18"
            fill="rgba(180,83,9,0.14)" stroke="rgba(251,191,36,0.55)" stroke-width="3.5" />
          <g stroke-linecap="round">
            <line x1="-168" y1="-186" x2="90" y2="-186" stroke="rgba(255,255,255,0.4)" stroke-width="8" />
            <line x1="-168" y1="-132" x2="160" y2="-132" stroke="rgba(255,255,255,0.3)" stroke-width="8" />
            <line x1="-168" y1="-78" x2="40" y2="-78" stroke="rgba(255,255,255,0.3)" stroke-width="8" />
            <line x1="-168" y1="-24" x2="120" y2="-24" stroke="rgba(255,255,255,0.22)" stroke-width="8" />
          </g>
          <!-- meta block -->
          <rect x="-212" y="40" width="424" height="110" rx="18"
            fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.3)" stroke-width="3.5" />
          <line x1="-168" y1="95" x2="20" y2="95" stroke="rgba(255,255,255,0.26)"
            stroke-width="8" stroke-linecap="round" />
          <!-- requestId beacon -->
          <circle cx="160" cy="95" r="11" fill="#fbbf24" filter="url(#accentGlow)" />
          <!-- foundation courses -->
          <g stroke="rgba(255,255,255,0.25)" stroke-width="3.5">
            <line x1="-256" y1="196" x2="256" y2="196" />
            <line x1="-256" y1="244" x2="256" y2="244" />
          </g>
          <line x1="-90" y1="196" x2="-90" y2="244" stroke="rgba(255,255,255,0.25)" stroke-width="3.5" />
          <line x1="110" y1="196" x2="110" y2="244" stroke="rgba(255,255,255,0.25)" stroke-width="3.5" />
        </g>

        <!-- ===== ENDPOINT PINS (left): every route plugs into the same shape ===== -->
        <g stroke-linecap="round">
          <g stroke="rgba(251,191,36,0.7)" stroke-width="5">
            <line x1="520" y1="380" x2="720" y2="380" />
            <line x1="560" y1="500" x2="720" y2="500" />
            <line x1="520" y1="620" x2="720" y2="620" />
            <line x1="560" y1="740" x2="720" y2="740" />
          </g>
          <!-- method chips at line heads -->
          <g fill="rgba(9,9,11,0.9)" stroke="rgba(251,191,36,0.7)" stroke-width="3.5">
            <rect x="420" y="352" width="100" height="56" rx="14" />
            <rect x="460" y="472" width="100" height="56" rx="14" />
            <rect x="420" y="592" width="100" height="56" rx="14" />
            <rect x="460" y="712" width="100" height="56" rx="14" />
          </g>
          <g stroke="rgba(255,255,255,0.35)" stroke-width="6">
            <line x1="446" y1="380" x2="494" y2="380" />
            <line x1="486" y1="500" x2="534" y2="500" />
            <line x1="446" y1="620" x2="494" y2="620" />
            <line x1="486" y1="740" x2="534" y2="740" />
          </g>
        </g>

        <!-- ===== STATUS LIGHTS (right): semantics, unambiguous ===== -->
        <g stroke="rgba(251,191,36,0.7)" stroke-width="5" stroke-linecap="round">
          <line x1="1328" y1="420" x2="1520" y2="420" />
          <line x1="1328" y1="560" x2="1560" y2="560" />
          <line x1="1328" y1="700" x2="1520" y2="700" />
        </g>
        <g filter="url(#accentGlow)">
          <circle cx="1560" cy="420" r="14" fill="#fbbf24" />
          <circle cx="1600" cy="560" r="14" fill="rgba(251,191,36,0.75)" />
          <circle cx="1560" cy="700" r="14" fill="rgba(251,191,36,0.45)" />
        </g>
        <!-- ordered status rail -->
        <g stroke="rgba(255,255,255,0.2)" stroke-width="3.5" stroke-linecap="round">
          <line x1="1660" y1="380" x2="1660" y2="740" />
          <line x1="1640" y1="420" x2="1680" y2="420" />
          <line x1="1640" y1="560" x2="1680" y2="560" />
          <line x1="1640" y1="700" x2="1680" y2="700" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1024" cy="930" rx="340" ry="28" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1024" cy="895" rx="220" ry="18" fill="rgba(180,83,9,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
