<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: emerald (databases & infra) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 50%,
            rgba(13, 128, 106, 0.28),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 84% 26%,
            rgba(13, 128, 106, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <linearGradient id="pipeGrad" gradientUnits="userSpaceOnUse"
            x1="160" y1="0" x2="1900" y2="0">
            <stop offset="0" stop-color="rgba(52,211,153,0.2)" />
            <stop offset="1" stop-color="#34d399" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="310" cy="180" r="4" />
          <circle cx="1795" cy="205" r="4" />
          <circle cx="1740" cy="945" r="4" />
          <circle cx="230" cy="900" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1550 140 h 26 M 1563 127 v 26" />
          <path d="M 150 460 h 24 M 162 448 v 24" />
          <path d="M 1915 655 h 24 M 1927 643 v 24" />
        </g>

        <!-- ===== the pipe rail ===== -->
        <path d="M 200 576 H 1860" stroke="url(#pipeGrad)" stroke-width="5"
          fill="none" stroke-linecap="round" opacity="0.5" />

        <!-- raw documents entering (left, messy cloud) -->
        <g fill="rgba(9,9,11,0.85)" stroke="rgba(52,211,153,0.4)" stroke-width="3">
          <rect x="180" y="430" width="70" height="90" rx="10" />
          <rect x="270" y="500" width="70" height="90" rx="10" transform="rotate(8 305 545)" />
          <rect x="200" y="620" width="70" height="90" rx="10" transform="rotate(-7 235 665)" />
          <rect x="300" y="380" width="70" height="90" rx="10" transform="rotate(-10 335 425)" />
        </g>
        <g stroke="rgba(52,211,153,0.35)" stroke-width="4" stroke-linecap="round">
          <line x1="196" y1="452" x2="232" y2="452" />
          <line x1="196" y1="472" x2="222" y2="472" />
          <line x1="316" y1="404" x2="348" y2="410" />
        </g>

        <!-- ===== stage 1: $match — the filter funnel ===== -->
        <g transform="translate(620,576)">
          <path d="M -90 -170 H 90 L 30 -40 V 40 L -30 40 V -40 Z"
            fill="rgba(9,9,11,0.88)" stroke="#34d399" stroke-width="5"
            stroke-linejoin="round" filter="url(#accentGlow)" />
          <!-- docs inside narrowing -->
          <g fill="rgba(52,211,153,0.5)">
            <rect x="-52" y="-150" width="26" height="34" rx="5" />
            <rect x="16" y="-146" width="26" height="34" rx="5" />
            <rect x="-13" y="-96" width="26" height="34" rx="5" />
          </g>
          <!-- rejected doc falling out -->
          <g transform="translate(-130,120) rotate(-16)" opacity="0.45">
            <rect x="-13" y="-17" width="26" height="34" rx="5"
              fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" />
            <line x1="-10" y1="-14" x2="10" y2="14" stroke="rgba(255,255,255,0.35)"
              stroke-width="3" stroke-linecap="round" />
          </g>
          <path d="M -60 60 C -80 90, -100 100, -118 106" fill="none"
            stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-dasharray="3 10"
            stroke-linecap="round" />
        </g>

        <!-- ===== stage 2: $group — docs merging into buckets ===== -->
        <g transform="translate(1024,576)">
          <circle r="96" fill="rgba(9,9,11,0.88)" stroke="#34d399" stroke-width="5"
            filter="url(#bigGlow)" />
          <!-- three small docs converging into one bucket -->
          <g stroke="rgba(52,211,153,0.5)" stroke-width="3.5" stroke-linecap="round" fill="none">
            <path d="M -58 -40 C -30 -20, -20 -10, -10 -2" />
            <path d="M 0 -62 V -14" />
            <path d="M 58 -40 C 30 -20, 20 -10, 10 -2" />
          </g>
          <g fill="rgba(52,211,153,0.5)">
            <rect x="-68" y="-58" width="22" height="28" rx="4" />
            <rect x="-11" y="-80" width="22" height="28" rx="4" />
            <rect x="46" y="-58" width="22" height="28" rx="4" />
          </g>
          <!-- the grouped bucket -->
          <path d="M -34 8 H 34 V 44 A 12 12 0 0 1 22 56 H -22 A 12 12 0 0 1 -34 44 Z"
            fill="rgba(13,128,106,0.35)" stroke="#34d399" stroke-width="4" />
          <line x1="-18" y1="30" x2="18" y2="30" stroke="#34d399" stroke-width="4"
            stroke-linecap="round" />
        </g>

        <!-- ===== stage 3: $lookup — joining a side collection ===== -->
        <g transform="translate(1400,576)">
          <rect x="-84" y="-64" width="168" height="128" rx="18"
            fill="rgba(9,9,11,0.88)" stroke="#34d399" stroke-width="5" filter="url(#accentGlow)" />
          <rect x="-52" y="-30" width="60" height="60" rx="8"
            fill="rgba(52,211,153,0.4)" />
          <rect x="4" y="-14" width="46" height="44" rx="8"
            fill="rgba(255,255,255,0.14)" stroke="rgba(52,211,153,0.5)" stroke-width="3" />
          <!-- side collection cylinder feeding down -->
          <g transform="translate(0,-190)">
            <path d="M -56 -22 A 56 18 0 0 0 56 -22 V 24 A 56 18 0 0 1 -56 24 Z"
              fill="rgba(9,9,11,0.88)" stroke="rgba(52,211,153,0.5)" stroke-width="4" />
            <ellipse cx="0" cy="-22" rx="56" ry="18" fill="rgba(13,128,106,0.25)"
              stroke="rgba(52,211,153,0.5)" stroke-width="4" />
          </g>
          <path d="M 0 -148 V -72" stroke="rgba(52,211,153,0.45)" stroke-width="4"
            stroke-dasharray="3 12" stroke-linecap="round" fill="none" />
        </g>

        <!-- ===== stage 4: $project — the trimmed result ===== -->
        <g transform="translate(1730,576)">
          <rect x="-64" y="-84" width="128" height="168" rx="16"
            fill="rgba(9,9,11,0.9)" stroke="#34d399" stroke-width="5" filter="url(#bigGlow)" />
          <g stroke="#34d399" stroke-width="5" stroke-linecap="round">
            <line x1="-36" y1="-48" x2="36" y2="-48" />
            <line x1="-36" y1="-12" x2="22" y2="-12" />
            <line x1="-36" y1="24" x2="30" y2="24" />
          </g>
          <!-- shaved-off field drifting away -->
          <line x1="76" y1="60" x2="120" y2="76" stroke="rgba(255,255,255,0.2)"
            stroke-width="4" stroke-linecap="round" stroke-dasharray="4 10" />
        </g>

        <!-- flow dots between stages -->
        <g fill="#34d399" filter="url(#accentGlow)">
          <circle cx="800" cy="576" r="7" />
          <circle cx="1200" cy="576" r="7" />
          <circle cx="1560" cy="576" r="7" />
        </g>
        <!-- index hint: lightning-fast first stage marker -->
        <path d="M 560 330 l -16 44 h 22 l -16 44" fill="none" stroke="rgba(52,211,153,0.5)"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

        <!-- ground shadow -->
        <ellipse cx="1024" cy="990" rx="620" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1024" cy="945" rx="280" ry="16" fill="rgba(13,128,106,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
