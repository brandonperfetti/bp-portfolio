<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: cyan (CSS & design systems) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 44% 48%,
            rgba(15, 118, 110, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 82% 78%,
            rgba(15, 118, 110, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="300" cy="185" r="4" />
          <circle cx="1810" cy="195" r="4" />
          <circle cx="1730" cy="950" r="4" />
          <circle cx="230" cy="895" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1548 144 h 26 M 1561 131 v 26" />
          <path d="M 154 456 h 24 M 166 444 v 24" />
          <path d="M 1916 658 h 24 M 1928 646 v 24" />
        </g>

        <!-- ===== the custom property: a broadcasting variable chip ===== -->
        <g transform="translate(820,520)">
          <rect x="-140" y="-64" width="280" height="128" rx="26"
            fill="rgba(9,9,11,0.9)" stroke="#2dd4bf" stroke-width="5.5" filter="url(#bigGlow)" />
          <!-- drawn "--" prefix + value slot (no text) -->
          <g stroke="#2dd4bf" stroke-width="7" stroke-linecap="round">
            <line x1="-100" y1="0" x2="-72" y2="0" />
            <line x1="-60" y1="0" x2="-32" y2="0" />
          </g>
          <rect x="-8" y="-16" width="108" height="32" rx="16" fill="rgba(45,212,191,0.5)" />
        </g>

        <!-- ===== spokes: consumers everywhere ===== -->
        <g stroke="rgba(45,212,191,0.45)" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M 700 460 C 580 400, 480 360, 390 340" />
          <path d="M 940 450 C 1060 380, 1160 340, 1260 320" />
          <path d="M 960 560 C 1120 590, 1260 620, 1380 650" />
          <path d="M 740 590 C 640 660, 560 710, 480 750" />
        </g>

        <!-- consumer: spacing knob (uses var for gap) -->
        <g transform="translate(310,310)">
          <rect x="-90" y="-56" width="180" height="112" rx="16"
            fill="rgba(9,9,11,0.88)" stroke="rgba(45,212,191,0.55)" stroke-width="4" />
          <g fill="rgba(45,212,191,0.5)">
            <rect x="-58" y="-20" width="30" height="40" rx="6" />
            <rect x="-14" y="-20" width="30" height="40" rx="6" />
            <rect x="30" y="-20" width="30" height="40" rx="6" />
          </g>
        </g>

        <!-- consumer: type-scale block -->
        <g transform="translate(1360,290)">
          <rect x="-96" y="-62" width="192" height="124" rx="16"
            fill="rgba(9,9,11,0.88)" stroke="rgba(45,212,191,0.55)" stroke-width="4" />
          <g fill="rgba(255,255,255,0.2)">
            <rect x="-60" y="22" width="120" height="10" rx="5" />
            <rect x="-60" y="-4" width="90" height="14" rx="7" />
            <rect x="-60" y="-40" width="60" height="20" rx="8" />
          </g>
        </g>

        <!-- consumer: themed button (dark scope overrides it) -->
        <g transform="translate(1500,690)">
          <!-- scope boundary: a re-declared zone -->
          <rect x="-190" y="-120" width="380" height="240" rx="22"
            fill="rgba(15,118,110,0.12)" stroke="rgba(45,212,191,0.4)" stroke-width="3.5"
            stroke-dasharray="14 12" />
          <!-- small re-declaration chip at the boundary -->
          <g transform="translate(-150,-120)">
            <rect x="-36" y="-20" width="72" height="40" rx="14"
              fill="rgba(9,9,11,0.9)" stroke="#2dd4bf" stroke-width="3.5" filter="url(#accentGlow)" />
            <g stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round">
              <line x1="-18" y1="0" x2="-6" y2="0" />
              <line x1="2" y1="0" x2="14" y2="0" />
            </g>
          </g>
          <rect x="-110" y="-40" width="220" height="80" rx="40"
            fill="rgba(45,212,191,0.55)" stroke="#2dd4bf" stroke-width="4"
            filter="url(#accentGlow)" />
          <rect x="-56" y="-9" width="112" height="18" rx="9" fill="rgba(9,9,11,0.7)" />
        </g>

        <!-- consumer: JS bridge — a getComputedStyle tap -->
        <g transform="translate(420,800)">
          <rect x="-100" y="-58" width="200" height="116" rx="16"
            fill="rgba(9,9,11,0.88)" stroke="rgba(45,212,191,0.55)" stroke-width="4" />
          <path d="M -62 -14 l 20 14 l -20 14" fill="none" stroke="#2dd4bf"
            stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="-26" y="-7" width="82" height="14" rx="7" fill="rgba(45,212,191,0.45)" />
          <!-- two-way arrows: JS can read and write it -->
          <g stroke="rgba(45,212,191,0.5)" stroke-width="3.5" stroke-linecap="round"
            stroke-linejoin="round" fill="none">
            <path d="M -30 34 h 60 M 18 26 l 12 8 l -12 8" />
            <path d="M 30 -34 h -60 M -18 -42 l -12 8 l 12 8" transform="translate(0,72)" />
          </g>
        </g>

        <!-- media-query dial feeding the chip: responsive re-assignment -->
        <g transform="translate(820,220)">
          <circle r="46" fill="rgba(9,9,11,0.88)" stroke="rgba(45,212,191,0.6)"
            stroke-width="4" />
          <path d="M 0 0 L 22 -22" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />
          <circle r="7" fill="#2dd4bf" />
          <g fill="rgba(45,212,191,0.45)">
            <circle cx="-30" cy="-30" r="4" />
            <circle cx="0" cy="-42" r="4" />
            <circle cx="30" cy="-30" r="4" />
          </g>
        </g>
        <path d="M 820 268 V 448" stroke="rgba(45,212,191,0.45)" stroke-width="4"
          stroke-dasharray="3 12" stroke-linecap="round" fill="none" />

        <!-- cascade sparkles drifting down from the chip -->
        <g fill="rgba(45,212,191,0.35)">
          <circle cx="1060" cy="480" r="6" />
          <circle cx="640" cy="520" r="6" />
          <circle cx="900" cy="640" r="5" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1000" cy="995" rx="620" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="820" cy="950" rx="260" ry="16" fill="rgba(15,118,110,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
