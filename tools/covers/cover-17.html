<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: fuchsia (JS/TS language internals) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 52% 48%,
            rgba(162, 28, 175, 0.26),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 78% 20%,
            rgba(162, 28, 175, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="320" cy="190" r="4" />
          <circle cx="1810" cy="200" r="4" />
          <circle cx="1760" cy="940" r="4" />
          <circle cx="210" cy="860" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1600 170 h 26 M 1613 157 v 26" />
          <path d="M 140 620 h 24 M 152 608 v 24" />
          <path d="M 1930 520 h 24 M 1942 508 v 24" />
        </g>

        <!-- ===== ORBIT RINGS around the call stack ===== -->
        <!-- outer ring: macrotask queue (ellipse orbit) -->
        <ellipse cx="1024" cy="576" rx="640" ry="380" fill="none"
          stroke="rgba(255,255,255,0.14)" stroke-width="3" />
        <!-- inner ring: microtask lane, brighter, runs first -->
        <ellipse cx="1024" cy="576" rx="420" ry="245" fill="none"
          stroke="rgba(232,121,249,0.4)" stroke-width="4" stroke-dasharray="2 18"
          stroke-linecap="round" />

        <!-- ===== CENTER: the call stack ===== -->
        <g transform="translate(1024,576)">
          <!-- stack frames, bottom-up -->
          <g stroke-width="4">
            <rect x="-130" y="60" width="260" height="64" rx="14"
              fill="rgba(9,9,11,0.9)" stroke="rgba(255,255,255,0.35)" />
            <rect x="-118" y="-14" width="236" height="64" rx="14"
              fill="rgba(9,9,11,0.9)" stroke="rgba(255,255,255,0.42)" />
            <rect x="-106" y="-88" width="212" height="64" rx="14"
              fill="rgba(162,28,175,0.16)" stroke="#e879f9" filter="url(#bigGlow)" />
          </g>
          <!-- active frame core -->
          <circle cy="-56" r="10" fill="#e879f9" filter="url(#accentGlow)" />
          <!-- one-at-a-time beam pointing up out of the stack -->
          <line x1="0" y1="-124" x2="0" y2="-210" stroke="rgba(232,121,249,0.6)"
            stroke-width="5" stroke-linecap="round" />
          <path d="M -16 -196 L 0 -224 L 16 -196 Z" fill="rgba(232,121,249,0.6)" />
        </g>

        <!-- ===== MICROTASKS on the inner ring (small dots, jumping the line) ===== -->
        <g fill="#e879f9" filter="url(#accentGlow)">
          <circle cx="1352" cy="437" r="10" />
          <circle cx="1430" cy="530" r="10" />
          <circle cx="1398" cy="646" r="10" />
        </g>
        <!-- microtask feed arrow into the stack -->
        <path d="M 1330 470 C 1240 520, 1180 540, 1136 552" fill="none"
          stroke="rgba(232,121,249,0.55)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 1156 538 L 1128 556 L 1160 566 Z" fill="rgba(232,121,249,0.55)" />

        <!-- ===== MACROTASKS on the outer ring (squares, waiting their turn) ===== -->
        <g fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.35)" stroke-width="3.5">
          <rect x="440" y="330" width="56" height="56" rx="12" transform="rotate(-8 468 358)" />
          <rect x="356" y="560" width="56" height="56" rx="12" transform="rotate(6 384 588)" />
          <rect x="520" y="800" width="56" height="56" rx="12" transform="rotate(-5 548 828)" />
          <rect x="1520" y="830" width="56" height="56" rx="12" transform="rotate(7 1548 858)" />
        </g>
        <!-- a macrotask fading at the very back of the line -->
        <rect x="1620" y="300" width="56" height="56" rx="12" transform="rotate(9 1648 328)"
          fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3.5" />

        <!-- direction ticks on the outer orbit -->
        <g stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M 1024 196 l 26 14 l -26 14" />
          <path d="M 1024 928 l -26 14 l 26 14" transform="translate(0,-28)" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1024" cy="920" rx="300" ry="24" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1024" cy="880" rx="200" ry="18" fill="rgba(162,28,175,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
