<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: sky (React/Next & frontend patterns) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 52% 50%,
            rgba(3, 105, 161, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 16% 76%,
            rgba(3, 105, 161, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="310" cy="186" r="4" />
          <circle cx="1798" cy="200" r="4" />
          <circle cx="1740" cy="948" r="4" />
          <circle cx="226" cy="902" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 1546 144 h 26 M 1559 131 v 26" />
          <path d="M 148 452 h 24 M 160 440 v 24" />
          <path d="M 1920 662 h 24 M 1932 650 v 24" />
        </g>

        <!-- ===== the outer shell with an open slot ===== -->
        <g transform="translate(1120,540)">
          <!-- shell: a frame with a notched opening on its left face -->
          <path
            d="M -110 -290 H 350 A 30 30 0 0 1 380 -260 V 260 A 30 30 0 0 1 350 290 H -350 A 30 30 0 0 1 -380 260 V -60 A 30 30 0 0 1 -350 -90 H -190 A 30 30 0 0 0 -160 -120 V -260 A 30 30 0 0 1 -130 -290 Z"
            fill="rgba(9,9,11,0.88)"
            stroke="#38bdf8"
            stroke-width="5"
            stroke-linejoin="round"
            filter="url(#bigGlow)"
          />
          <!-- slot rim highlight -->
          <path
            d="M -160 -120 A 30 30 0 0 1 -190 -90 H -350"
            fill="none"
            stroke="rgba(56,189,248,0.55)"
            stroke-width="4"
            stroke-linecap="round"
          />
          <!-- interior content rows already composed -->
          <g fill="rgba(56,189,248,0.35)">
            <rect x="-60" y="-230" width="360" height="16" rx="8" />
            <rect x="-60" y="-190" width="280" height="12" rx="6" />
          </g>
          <g fill="rgba(255,255,255,0.1)">
            <rect x="-320" y="20" width="640" height="14" rx="7" />
            <rect x="-320" y="60" width="520" height="14" rx="7" />
            <rect x="-320" y="100" width="580" height="14" rx="7" />
          </g>
          <!-- nested slot inside: composition all the way down -->
          <rect
            x="-320"
            y="160"
            width="300"
            height="90"
            rx="14"
            fill="none"
            stroke="rgba(56,189,248,0.4)"
            stroke-width="3.5"
            stroke-dasharray="12 10"
          />
        </g>

        <!-- ===== the child card sliding into the slot ===== -->
        <g transform="translate(490,340) rotate(-6)">
          <rect
            x="-180"
            y="-90"
            width="360"
            height="180"
            rx="20"
            fill="rgba(3,105,161,0.35)"
            stroke="#38bdf8"
            stroke-width="5"
            filter="url(#accentGlow)"
          />
          <circle cx="-110" cy="-20" r="26" fill="rgba(56,189,248,0.5)" />
          <rect
            x="-60"
            y="-34"
            width="200"
            height="14"
            rx="7"
            fill="rgba(56,189,248,0.55)"
          />
          <rect
            x="-60"
            y="-2"
            width="150"
            height="12"
            rx="6"
            fill="rgba(255,255,255,0.16)"
          />
          <!-- its plug tab matching the slot -->
          <path
            d="M 180 -40 h 40 v 80 h -40"
            fill="none"
            stroke="#38bdf8"
            stroke-width="4.5"
            stroke-linecap="round"
          />
        </g>
        <!-- motion arrows into the slot -->
        <g
          stroke="#38bdf8"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.8"
        >
          <path d="M 700 400 C 740 410, 780 420, 820 432" />
          <path d="M 796 414 L 836 436 L 800 452" />
        </g>

        <!-- ===== children flowing as a river through the shell (not drilled) ===== -->
        <path
          d="M 300 700 C 500 680, 700 690, 900 700 C 1100 710, 1300 700, 1480 690"
          fill="none"
          stroke="rgba(56,189,248,0.35)"
          stroke-width="4"
          stroke-dasharray="16 12"
          stroke-linecap="round"
        />
        <g fill="rgba(56,189,248,0.55)">
          <rect x="520" y="686" width="36" height="20" rx="8" />
          <rect x="980" y="692" width="36" height="20" rx="8" />
          <rect x="1320" y="686" width="36" height="20" rx="8" />
        </g>

        <!-- ===== the anti-pattern: prop-drilling ladder, faint and crossed ===== -->
        <g opacity="0.45" transform="translate(280,420)">
          <g
            fill="rgba(9,9,11,0.8)"
            stroke="rgba(255,255,255,0.25)"
            stroke-width="3"
          >
            <rect x="-70" y="-180" width="140" height="60" rx="10" />
            <rect x="-70" y="-90" width="140" height="60" rx="10" />
            <rect x="-70" y="0" width="140" height="60" rx="10" />
            <rect x="-70" y="90" width="140" height="60" rx="10" />
          </g>
          <!-- the same prop passed down every rung -->
          <g
            stroke="rgba(255,255,255,0.3)"
            stroke-width="3.5"
            stroke-linecap="round"
            fill="none"
          >
            <path d="M 0 -120 V -90 M 0 -30 V 0 M 0 60 V 90" />
          </g>
          <g fill="rgba(255,255,255,0.25)">
            <circle cx="0" cy="-105" r="6" />
            <circle cx="0" cy="-15" r="6" />
            <circle cx="0" cy="75" r="6" />
          </g>
          <line
            x1="-90"
            y1="-190"
            x2="90"
            y2="160"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="4.5"
            stroke-linecap="round"
          />
        </g>

        <!-- context beam: one clean broadcast skipping the rungs -->
        <path
          d="M 340 250 C 600 190, 950 180, 1240 220"
          fill="none"
          stroke="rgba(56,189,248,0.4)"
          stroke-width="4"
          stroke-dasharray="2 14"
          stroke-linecap="round"
        />
        <circle
          cx="340"
          cy="250"
          r="10"
          fill="rgba(56,189,248,0.6)"
          filter="url(#accentGlow)"
        />

        <!-- compound-component keyring: small linked chips bottom right -->
        <g transform="translate(1700,930)">
          <g
            fill="rgba(9,9,11,0.88)"
            stroke="rgba(56,189,248,0.55)"
            stroke-width="3.5"
          >
            <rect x="-150" y="-30" width="90" height="60" rx="12" />
            <rect x="-45" y="-30" width="90" height="60" rx="12" />
            <rect x="60" y="-30" width="90" height="60" rx="12" />
          </g>
          <g
            stroke="rgba(56,189,248,0.5)"
            stroke-width="4"
            stroke-linecap="round"
          >
            <line x1="-60" y1="0" x2="-45" y2="0" />
            <line x1="45" y1="0" x2="60" y2="0" />
          </g>
        </g>

        <!-- ground shadow -->
        <ellipse cx="1050" cy="1000" rx="660" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse
          cx="1120"
          cy="955"
          rx="300"
          ry="16"
          fill="rgba(3,105,161,0.12)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
