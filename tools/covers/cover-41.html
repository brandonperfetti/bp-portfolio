<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: sky (React & Next.js) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 52% 50%,
            rgba(3, 105, 161, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 25% 20%,
            rgba(3, 105, 161, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <linearGradient id="routeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#38bdf8" />
            <stop offset="1" stop-color="#0369a1" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="330" cy="170" r="4" />
          <circle cx="1790" cy="230" r="4" />
          <circle cx="1700" cy="980" r="4" />
          <circle cx="220" cy="870" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1620 150 h 26 M 1633 137 v 26" />
          <path d="M 140 640 h 24 M 152 628 v 24" />
          <path d="M 1930 480 h 24 M 1942 468 v 24" />
        </g>

        <!-- ===== CUTAWAY: nested layout shells, seen in cross-section ===== -->
        <!-- outermost shell: root layout (persists) -->
        <g transform="translate(1024,576)">
          <rect x="-620" y="-380" width="1240" height="760" rx="34"
            fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
          <!-- persistent chrome: top bar of the root shell -->
          <line x1="-620" y1="-296" x2="620" y2="-296" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
          <circle cx="-556" cy="-338" r="10" fill="rgba(255,255,255,0.25)" />
          <line x1="-500" y1="-338" x2="-330" y2="-338" stroke="rgba(255,255,255,0.25)"
            stroke-width="7" stroke-linecap="round" />

          <!-- nested segment layout -->
          <rect x="-540" y="-236" width="1080" height="556" rx="26"
            fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.24)" stroke-width="3.5" />
          <!-- its rail (persists across navigations) -->
          <g stroke-linecap="round">
            <line x1="-480" y1="-160" x2="-300" y2="-160" stroke="rgba(255,255,255,0.3)" stroke-width="8" />
            <line x1="-480" y1="-96" x2="-340" y2="-96" stroke="rgba(255,255,255,0.22)" stroke-width="8" />
            <line x1="-480" y1="-32" x2="-320" y2="-32" stroke="rgba(255,255,255,0.22)" stroke-width="8" />
            <line x1="-480" y1="32" x2="-360" y2="32" stroke="rgba(255,255,255,0.16)" stroke-width="8" />
          </g>
          <line x1="-240" y1="-236" x2="-240" y2="320" stroke="rgba(255,255,255,0.24)" stroke-width="3.5" />

          <!-- the page segment: the one piece that actually swaps -->
          <rect x="-180" y="-176" width="660" height="436" rx="22"
            fill="rgba(3,105,161,0.12)" stroke="#38bdf8" stroke-width="5" filter="url(#bigGlow)" />
          <g stroke-linecap="round">
            <line x1="-120" y1="-104" x2="240" y2="-104" stroke="rgba(255,255,255,0.42)" stroke-width="9" />
            <line x1="-120" y1="-36" x2="380" y2="-36" stroke="rgba(255,255,255,0.3)" stroke-width="8" />
            <line x1="-120" y1="32" x2="300" y2="32" stroke="rgba(255,255,255,0.3)" stroke-width="8" />
            <line x1="-120" y1="100" x2="350" y2="100" stroke="rgba(255,255,255,0.22)" stroke-width="8" />
            <line x1="-120" y1="168" x2="200" y2="168" stroke="rgba(255,255,255,0.16)" stroke-width="8" />
          </g>
          <!-- server boundary marker on the swapping segment -->
          <circle cx="440" cy="-136" r="12" fill="#38bdf8" filter="url(#accentGlow)" />
        </g>

        <!-- ===== THE ROUTE DRILL: url path descending through the layers ===== -->
        <g fill="none" stroke-linecap="round">
          <path d="M 700 120 V 240 Q 700 262 722 262 H 806 Q 828 262 828 284 V 360 Q 828 382 850 382 H 902"
            stroke="url(#routeGrad)" stroke-width="6" filter="url(#accentGlow)" />
        </g>
        <!-- segment nodes where the path crosses each shell -->
        <g fill="#38bdf8" filter="url(#accentGlow)">
          <circle cx="700" cy="196" r="9" />
          <circle cx="828" cy="340" r="9" />
          <circle cx="902" cy="382" r="10" />
        </g>
        <!-- entry chevron at top -->
        <path d="M 684 96 L 700 120 L 716 96" fill="none" stroke="#38bdf8"
          stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- scar tissue: one hard-learned patch, stitched -->
        <g stroke="rgba(255,255,255,0.25)" stroke-width="3.5" stroke-linecap="round">
          <path d="M 1560 830 q 40 -26 80 0" fill="none" />
          <line x1="1572" y1="812" x2="1580" y2="840" />
          <line x1="1600" y1="806" x2="1602" y2="836" />
          <line x1="1628" y1="812" x2="1622" y2="840" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1024" cy="1000" rx="560" ry="30" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1160" cy="960" rx="260" ry="20" fill="rgba(3,105,161,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
