<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: cyan (CSS & design systems) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 62% 48%,
            rgba(15, 118, 110, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 20% 30%,
            rgba(15, 118, 110, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="310" cy="180" r="4" />
          <circle cx="1820" cy="210" r="4" />
          <circle cx="1750" cy="960" r="4" />
          <circle cx="200" cy="890" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1560 160 h 26 M 1573 147 v 26" />
          <path d="M 130 560 h 24 M 142 548 v 24" />
          <path d="M 1920 640 h 24 M 1932 628 v 24" />
        </g>

        <!-- ===== SCATTER (left): config-era fragments, drifting at angles ===== -->
        <g stroke-width="3.5" fill="rgba(255,255,255,0.03)">
          <rect x="180" y="260" width="150" height="52" rx="14" transform="rotate(-12 255 286)"
            stroke="rgba(255,255,255,0.3)" />
          <rect x="330" y="420" width="110" height="52" rx="14" transform="rotate(8 385 446)"
            stroke="rgba(255,255,255,0.24)" />
          <rect x="170" y="560" width="180" height="52" rx="14" transform="rotate(-6 260 586)"
            stroke="rgba(255,255,255,0.3)" />
          <rect x="350" y="700" width="130" height="52" rx="14" transform="rotate(10 415 726)"
            stroke="rgba(255,255,255,0.22)" />
          <rect x="200" y="840" width="120" height="52" rx="14" transform="rotate(-9 260 866)"
            stroke="rgba(255,255,255,0.18)" />
          <!-- the old config file, tipping over -->
          <rect x="420" y="220" width="120" height="150" rx="16" transform="rotate(14 480 295)"
            stroke="rgba(255,255,255,0.18)" stroke-dasharray="10 12" />
        </g>
        <!-- short bars inside a few fragments -->
        <g stroke="rgba(255,255,255,0.22)" stroke-width="7" stroke-linecap="round">
          <line x1="212" y1="282" x2="296" y2="264" />
          <line x1="204" y1="584" x2="316" y2="572" />
          <line x1="380" y1="452" x2="424" y2="458" />
        </g>

        <!-- ===== CONVERGENCE: fragments funnel into ordered streams ===== -->
        <g fill="none" stroke-linecap="round">
          <path d="M 560 340 C 740 380, 860 470, 980 500" stroke="rgba(45,212,191,0.5)" stroke-width="5" />
          <path d="M 500 590 C 700 590, 850 570, 980 560" stroke="rgba(45,212,191,0.65)" stroke-width="5" />
          <path d="M 540 780 C 740 740, 870 660, 980 620" stroke="rgba(45,212,191,0.5)" stroke-width="5" />
        </g>
        <g fill="#2dd4bf" filter="url(#accentGlow)">
          <circle cx="980" cy="500" r="8" />
          <circle cx="980" cy="560" r="8" />
          <circle cx="980" cy="620" r="8" />
        </g>

        <!-- ===== ORDER (right): the single CSS-first sheet ===== -->
        <g transform="translate(1430,576)">
          <!-- sheet -->
          <rect x="-330" y="-330" width="660" height="660" rx="28"
            fill="rgba(9,9,11,0.88)" stroke="#2dd4bf" stroke-width="5" filter="url(#bigGlow)" />
          <!-- @theme token block -->
          <rect x="-270" y="-262" width="540" height="180" rx="18"
            fill="rgba(15,118,110,0.14)" stroke="rgba(45,212,191,0.5)" stroke-width="3.5" />
          <g stroke-linecap="round">
            <line x1="-226" y1="-212" x2="-40" y2="-212" stroke="rgba(45,212,191,0.8)" stroke-width="8" />
            <line x1="-226" y1="-162" x2="120" y2="-162" stroke="rgba(255,255,255,0.32)" stroke-width="8" />
            <line x1="-226" y1="-112" x2="60" y2="-112" stroke="rgba(255,255,255,0.32)" stroke-width="8" />
          </g>
          <!-- ordered utility rows below: aligned, calm -->
          <g stroke-linecap="round">
            <line x1="-226" y1="-10" x2="180" y2="-10" stroke="rgba(255,255,255,0.34)" stroke-width="8" />
            <line x1="-226" y1="60" x2="90" y2="60" stroke="rgba(255,255,255,0.28)" stroke-width="8" />
            <line x1="-226" y1="130" x2="226" y2="130" stroke="rgba(255,255,255,0.34)" stroke-width="8" />
            <line x1="-226" y1="200" x2="130" y2="200" stroke="rgba(255,255,255,0.24)" stroke-width="8" />
            <line x1="-226" y1="270" x2="40" y2="270" stroke="rgba(255,255,255,0.18)" stroke-width="8" />
          </g>
          <!-- token swatch dots on the right rail -->
          <g>
            <circle cx="258" cy="-212" r="10" fill="#2dd4bf" filter="url(#accentGlow)" />
            <circle cx="258" cy="-162" r="10" fill="rgba(45,212,191,0.55)" />
            <circle cx="258" cy="-112" r="10" fill="rgba(45,212,191,0.3)" />
          </g>
        </g>

        <!-- speed tick: the oxide-fast rebuild -->
        <g stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" filter="url(#accentGlow)">
          <path d="M 1850 300 l 40 -44 l -18 44 l 40 -8 l -58 62 l 16 -50 Z" fill="rgba(45,212,191,0.2)" stroke-linejoin="round" />
        </g>

        <!-- ground shadows -->
        <ellipse cx="1430" cy="940" rx="330" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="330" cy="930" rx="200" ry="20" fill="rgba(0,0,0,0.4)" />
        <ellipse cx="800" cy="880" rx="180" ry="16" fill="rgba(15,118,110,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
