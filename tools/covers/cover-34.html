<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: cyan (CSS & design systems) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 52% 50%,
            rgba(15, 118, 110, 0.3),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 16% 26%,
            rgba(15, 118, 110, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="312" cy="178" r="4" />
          <circle cx="1802" cy="208" r="4" />
          <circle cx="1736" cy="942" r="4" />
          <circle cx="242" cy="896" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1554 138 h 26 M 1567 125 v 26" />
          <path d="M 148 448 h 24 M 160 436 v 24" />
          <path d="M 1918 654 h 24 M 1930 642 v 24" />
        </g>

        <!-- ===== the drafting table: a luminous grid plane ===== -->
        <g transform="translate(1090,560)">
          <!-- outer canvas -->
          <rect x="-520" y="-330" width="1040" height="660" rx="24"
            fill="rgba(9,9,11,0.85)" stroke="#2dd4bf" stroke-width="5" filter="url(#bigGlow)" />
          <!-- column lines (blueprint) -->
          <g stroke="rgba(45,212,191,0.28)" stroke-width="3" stroke-dasharray="8 10">
            <line x1="-346" y1="-330" x2="-346" y2="330" />
            <line x1="-173" y1="-330" x2="-173" y2="330" />
            <line x1="0" y1="-330" x2="0" y2="330" />
            <line x1="173" y1="-330" x2="173" y2="330" />
            <line x1="346" y1="-330" x2="346" y2="330" />
          </g>
          <!-- row lines -->
          <g stroke="rgba(45,212,191,0.22)" stroke-width="3" stroke-dasharray="8 10">
            <line x1="-520" y1="-110" x2="520" y2="-110" />
            <line x1="-520" y1="110" x2="520" y2="110" />
          </g>

          <!-- placed items: snapped into the grid -->
          <!-- header spanning all columns -->
          <rect x="-490" y="-300" width="980" height="160" rx="14"
            fill="rgba(15,118,110,0.3)" stroke="#2dd4bf" stroke-width="4.5"
            filter="url(#accentGlow)" />
          <rect x="-440" y="-238" width="240" height="16" rx="8" fill="rgba(45,212,191,0.55)" />
          <!-- sidebar spanning two rows -->
          <rect x="-490" y="-80" width="290" height="380" rx="14"
            fill="rgba(9,9,11,0.9)" stroke="rgba(45,212,191,0.6)" stroke-width="4" />
          <g fill="rgba(45,212,191,0.4)">
            <rect x="-450" y="-30" width="180" height="14" rx="7" />
            <rect x="-450" y="10" width="140" height="14" rx="7" />
            <rect x="-450" y="50" width="160" height="14" rx="7" />
          </g>
          <!-- main content card -->
          <rect x="-150" y="-80" width="480" height="180" rx="14"
            fill="rgba(9,9,11,0.9)" stroke="rgba(45,212,191,0.6)" stroke-width="4" />
          <rect x="-110" y="-40" width="300" height="14" rx="7" fill="rgba(45,212,191,0.45)" />
          <rect x="-110" y="-8" width="240" height="12" rx="6" fill="rgba(255,255,255,0.14)" />
          <rect x="-110" y="22" width="270" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
          <!-- the item mid-flight: snapping into its named area -->
          <g transform="translate(240,210) rotate(-4)">
            <rect x="-120" y="-70" width="240" height="140" rx="14"
              fill="rgba(15,118,110,0.35)" stroke="#2dd4bf" stroke-width="4.5"
              filter="url(#accentGlow)" />
            <rect x="-80" y="-30" width="140" height="12" rx="6" fill="rgba(45,212,191,0.55)" />
          </g>
          <!-- its destination cell outlined, magnet ticks -->
          <rect x="356" y="120" width="154" height="200" rx="12" fill="none"
            stroke="#2dd4bf" stroke-width="4" stroke-dasharray="12 10" />
          <g stroke="rgba(45,212,191,0.55)" stroke-width="3.5" stroke-linecap="round">
            <path d="M 342 150 l -14 0 M 342 220 l -14 0 M 342 290 l -14 0" />
          </g>
          <!-- gap calipers between columns -->
          <g stroke="rgba(45,212,191,0.5)" stroke-width="3.5" stroke-linecap="round">
            <path d="M -173 -350 v -16 M 0 -350 v -16 M -173 -358 H 0" />
          </g>
        </g>

        <!-- ===== abandoned float raft, drifting away (the old way) ===== -->
        <g opacity="0.45" transform="translate(230,780) rotate(-8)">
          <rect x="-110" y="-60" width="220" height="120" rx="14"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.25)" stroke-width="3.5" />
          <g fill="rgba(255,255,255,0.12)">
            <rect x="-86" y="-34" width="80" height="68" rx="8" />
            <rect x="-86" y="-34" width="80" height="68" rx="8" transform="translate(96,10)" />
          </g>
          <!-- clearfix lifebuoy -->
          <circle cx="150" cy="-70" r="26" fill="none" stroke="rgba(255,255,255,0.22)"
            stroke-width="7" stroke-dasharray="12 10" />
        </g>
        <path d="M 350 720 C 420 680, 480 650, 540 630" fill="none"
          stroke="rgba(255,255,255,0.14)" stroke-width="3.5" stroke-dasharray="3 12"
          stroke-linecap="round" />

        <!-- responsive squeeze marks: grid re-flowing at a breakpoint -->
        <g stroke="rgba(45,212,191,0.5)" stroke-width="4" stroke-linecap="round"
          stroke-linejoin="round" fill="none">
          <path d="M 300 300 h 60 M 340 280 l 20 20 l -20 20" />
          <path d="M 300 360 h 44" opacity="0.6" />
        </g>

        <!-- ground shadow -->
        <ellipse cx="1090" cy="1000" rx="640" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1090" cy="955" rx="300" ry="16" fill="rgba(15,118,110,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
