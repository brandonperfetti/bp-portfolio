<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: amber (Node & APIs) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 54% 50%,
            rgba(217, 119, 6, 0.26),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 16% 28%,
            rgba(217, 119, 6, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="320" cy="185" r="4" />
          <circle cx="1790" cy="200" r="4" />
          <circle cx="1725" cy="945" r="4" />
          <circle cx="240" cy="905" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 1558 138 h 26 M 1571 125 v 26" />
          <path d="M 145 455 h 24 M 157 443 v 24" />
          <path d="M 1912 665 h 24 M 1924 653 v 24" />
        </g>

        <!-- ===== the token bucket, dripping capacity ===== -->
        <g transform="translate(1024,250)">
          <path
            d="M -110 -90 H 110 L 84 70 A 24 24 0 0 1 60 90 H -60 A 24 24 0 0 1 -84 70 Z"
            fill="rgba(9,9,11,0.88)"
            stroke="#fbbf24"
            stroke-width="5"
            stroke-linejoin="round"
            filter="url(#bigGlow)"
          />
          <!-- tokens inside -->
          <g fill="rgba(251,191,36,0.55)">
            <circle cx="-40" cy="-30" r="13" />
            <circle cx="8" cy="-44" r="13" />
            <circle cx="44" cy="-18" r="13" />
            <circle cx="-6" cy="8" r="13" />
          </g>
          <!-- refill drip from above -->
          <g fill="rgba(251,191,36,0.4)">
            <circle cx="0" cy="-130" r="8" />
            <circle cx="0" cy="-170" r="6" />
          </g>
          <!-- token dropping to the gate -->
          <path
            d="M 0 90 V 180"
            stroke="rgba(251,191,36,0.45)"
            stroke-width="4"
            stroke-dasharray="3 12"
            stroke-linecap="round"
            fill="none"
          />
          <circle
            cx="0"
            cy="140"
            r="9"
            fill="#fbbf24"
            filter="url(#accentGlow)"
          />
        </g>

        <!-- ===== request stream approaching the gate ===== -->
        <path
          d="M 160 576 H 900"
          stroke="rgba(251,191,36,0.25)"
          stroke-width="4.5"
          stroke-linecap="round"
        />
        <g fill="rgba(251,191,36,0.6)">
          <circle cx="260" cy="576" r="11" />
          <circle cx="380" cy="576" r="11" />
          <circle cx="500" cy="576" r="11" />
          <circle cx="620" cy="576" r="11" />
          <circle cx="740" cy="576" r="11" />
          <circle cx="850" cy="576" r="11" />
        </g>
        <!-- burst cluster crowding at the gate -->
        <g fill="rgba(251,191,36,0.35)">
          <circle cx="900" cy="536" r="10" />
          <circle cx="912" cy="612" r="10" />
          <circle cx="872" cy="640" r="10" />
        </g>

        <!-- ===== the gate: a lit valve in a wall ===== -->
        <g transform="translate(1024,576)">
          <!-- wall segments above and below -->
          <line
            x1="0"
            y1="-330"
            x2="0"
            y2="-96"
            stroke="rgba(255,255,255,0.18)"
            stroke-width="7"
            stroke-linecap="round"
          />
          <line
            x1="0"
            y1="96"
            x2="0"
            y2="330"
            stroke="rgba(255,255,255,0.18)"
            stroke-width="7"
            stroke-linecap="round"
          />
          <!-- the valve ring -->
          <circle
            r="76"
            fill="rgba(9,9,11,0.9)"
            stroke="#fbbf24"
            stroke-width="5.5"
            filter="url(#bigGlow)"
          />
          <!-- aperture: partially open iris -->
          <path
            d="M -34 -26 H 34 M -42 0 H 42 M -34 26 H 34"
            stroke="#fbbf24"
            stroke-width="5"
            stroke-linecap="round"
          />
          <circle r="8" fill="#fbbf24" />
        </g>

        <!-- ===== passed requests: smooth, spaced, heading to the API ===== -->
        <path
          d="M 1148 576 H 1560"
          stroke="rgba(251,191,36,0.35)"
          stroke-width="4.5"
          stroke-linecap="round"
        />
        <g fill="#fbbf24" filter="url(#accentGlow)">
          <circle cx="1220" cy="576" r="10" />
          <circle cx="1360" cy="576" r="10" />
          <circle cx="1500" cy="576" r="10" />
        </g>
        <!-- the protected API block -->
        <g transform="translate(1720,576)">
          <rect
            x="-110"
            y="-120"
            width="220"
            height="240"
            rx="22"
            fill="rgba(9,9,11,0.9)"
            stroke="#fbbf24"
            stroke-width="5"
            filter="url(#bigGlow)"
          />
          <g
            stroke="rgba(251,191,36,0.5)"
            stroke-width="5"
            stroke-linecap="round"
          >
            <line x1="-64" y1="-56" x2="64" y2="-56" />
            <line x1="-64" y1="0" x2="40" y2="0" />
            <line x1="-64" y1="56" x2="54" y2="56" />
          </g>
          <!-- steady heartbeat under the block -->
          <path
            d="M -80 170 h 40 l 14 -26 l 20 52 l 14 -26 h 72"
            fill="none"
            stroke="rgba(251,191,36,0.45)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>

        <!-- ===== the polite refusal: one request bounced with a retry timer ===== -->
        <path
          d="M 950 640 C 900 760, 820 840, 700 880"
          fill="none"
          stroke="rgba(251,191,36,0.35)"
          stroke-width="4"
          stroke-dasharray="4 12"
          stroke-linecap="round"
        />
        <g transform="translate(620,900)">
          <circle
            r="44"
            fill="rgba(9,9,11,0.88)"
            stroke="rgba(251,191,36,0.6)"
            stroke-width="4"
          />
          <!-- clock face: retry-after -->
          <circle
            r="26"
            fill="none"
            stroke="rgba(251,191,36,0.5)"
            stroke-width="3.5"
          />
          <path
            d="M 0 0 V -16 M 0 0 L 12 8"
            stroke="#fbbf24"
            stroke-width="4"
            stroke-linecap="round"
            fill="none"
          />
        </g>
        <!-- Redis-shared ledger: small synced counters beneath the gate -->
        <g transform="translate(1200,900)">
          <rect
            x="-90"
            y="-38"
            width="180"
            height="76"
            rx="14"
            fill="rgba(9,9,11,0.85)"
            stroke="rgba(251,191,36,0.45)"
            stroke-width="3.5"
          />
          <g fill="rgba(251,191,36,0.55)">
            <rect x="-62" y="6" width="18" height="16" rx="4" />
            <rect x="-32" y="-6" width="18" height="28" rx="4" />
            <rect x="-2" y="-16" width="18" height="38" rx="4" />
            <rect x="28" y="-2" width="18" height="24" rx="4" />
          </g>
        </g>
        <path
          d="M 1120 800 C 1150 840, 1170 860, 1190 866"
          fill="none"
          stroke="rgba(251,191,36,0.3)"
          stroke-width="3.5"
          stroke-dasharray="3 12"
          stroke-linecap="round"
        />

        <!-- ground shadow -->
        <ellipse cx="1024" cy="1000" rx="620" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse
          cx="1150"
          cy="955"
          rx="260"
          ry="16"
          fill="rgba(217,119,6,0.12)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
