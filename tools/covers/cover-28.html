<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: violet (AI engineering) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 58% 50%,
            rgba(124, 58, 237, 0.28),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 16% 30%,
            rgba(124, 58, 237, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg class="motif" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <linearGradient id="streamGrad" gradientUnits="userSpaceOnUse"
            x1="180" y1="0" x2="1080" y2="0">
            <stop offset="0" stop-color="rgba(167,139,250,0.05)" />
            <stop offset="0.55" stop-color="rgba(167,139,250,0.45)" />
            <stop offset="1" stop-color="#a78bfa" />
          </linearGradient>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="300" cy="200" r="4" />
          <circle cx="1800" cy="190" r="4" />
          <circle cx="1750" cy="930" r="4" />
          <circle cx="220" cy="910" r="4" />
        </g>
        <g stroke="rgba(255,255,255,0.16)" stroke-width="3" stroke-linecap="round">
          <path d="M 1530 150 h 26 M 1543 137 v 26" />
          <path d="M 150 440 h 24 M 162 428 v 24" />
          <path d="M 1930 650 h 24 M 1942 638 v 24" />
        </g>

        <!-- ===== the token stream: chunks flying toward the panel ===== -->
        <!-- three streamlines converging, brightening toward arrival -->
        <path d="M 180 420 C 480 400, 760 440, 1060 500" fill="none"
          stroke="url(#streamGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 180 580 C 460 590, 760 570, 1060 560" fill="none"
          stroke="url(#streamGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 180 740 C 480 760, 780 700, 1060 620" fill="none"
          stroke="url(#streamGrad)" stroke-width="4.5" stroke-linecap="round" />
        <!-- token chunks riding the lines: small rounded bars, denser near panel -->
        <g fill="rgba(167,139,250,0.35)">
          <rect x="330" y="398" width="44" height="16" rx="8" />
          <rect x="360" y="574" width="36" height="16" rx="8" />
          <rect x="310" y="742" width="48" height="16" rx="8" />
        </g>
        <g fill="rgba(167,139,250,0.6)">
          <rect x="620" y="410" width="48" height="16" rx="8" />
          <rect x="680" y="568" width="40" height="16" rx="8" />
          <rect x="640" y="722" width="44" height="16" rx="8" />
        </g>
        <g fill="#a78bfa" filter="url(#accentGlow)">
          <rect x="900" y="452" width="52" height="16" rx="8" />
          <rect x="930" y="552" width="42" height="16" rx="8" />
          <rect x="890" y="668" width="48" height="16" rx="8" />
        </g>

        <!-- ===== the chat panel: messages assembling live ===== -->
        <g transform="translate(1440,560)">
          <rect x="-330" y="-330" width="660" height="660" rx="26"
            fill="rgba(9,9,11,0.88)" stroke="#a78bfa" stroke-width="5" filter="url(#bigGlow)" />
          <!-- panel header rule -->
          <line x1="-330" y1="-250" x2="330" y2="-250" stroke="rgba(167,139,250,0.35)"
            stroke-width="3.5" />
          <circle cx="-290" cy="-290" r="9" fill="rgba(167,139,250,0.5)" />
          <rect x="-262" y="-299" width="120" height="18" rx="9" fill="rgba(255,255,255,0.14)" />

          <!-- user bubble (right-aligned, settled) -->
          <rect x="20" y="-210" width="280" height="76" rx="18"
            fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="3" />
          <rect x="52" y="-188" width="200" height="12" rx="6" fill="rgba(255,255,255,0.25)" />
          <rect x="52" y="-164" width="150" height="12" rx="6" fill="rgba(255,255,255,0.18)" />

          <!-- assistant message: complete first paragraph -->
          <rect x="-300" y="-100" width="360" height="120" rx="18"
            fill="rgba(124,58,237,0.16)" stroke="rgba(167,139,250,0.5)" stroke-width="3.5" />
          <rect x="-272" y="-74" width="290" height="12" rx="6" fill="rgba(167,139,250,0.6)" />
          <rect x="-272" y="-50" width="250" height="12" rx="6" fill="rgba(167,139,250,0.45)" />
          <rect x="-272" y="-26" width="200" height="12" rx="6" fill="rgba(167,139,250,0.35)" />

          <!-- inline tool-call chip mid-message -->
          <g transform="translate(-190,60)">
            <rect x="-110" y="-26" width="220" height="52" rx="26"
              fill="rgba(9,9,11,0.9)" stroke="#a78bfa" stroke-width="3.5" filter="url(#accentGlow)" />
            <circle cx="-74" cy="0" r="9" fill="#a78bfa" />
            <rect x="-52" y="-7" width="130" height="14" rx="7" fill="rgba(167,139,250,0.45)" />
          </g>

          <!-- streaming tail: bars materializing + caret -->
          <g>
            <rect x="-300" y="140" width="300" height="12" rx="6" fill="rgba(167,139,250,0.55)" />
            <rect x="-300" y="168" width="220" height="12" rx="6" fill="rgba(167,139,250,0.35)" />
            <rect x="-300" y="196" width="140" height="12" rx="6" fill="rgba(167,139,250,0.2)" />
            <rect x="-148" y="190" width="10" height="24" rx="3" fill="#a78bfa"
              filter="url(#accentGlow)" />
          </g>

          <!-- composer bar -->
          <rect x="-300" y="250" width="600" height="56" rx="28"
            fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
          <circle cx="266" cy="278" r="17" fill="rgba(167,139,250,0.55)" />
          <path d="M 259 278 h 14 M 268 271 l 7 7 l -7 7" fill="none"
            stroke="#09090b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- dropped-chunk wisp: one token falling out of stream (state handling) -->
        <path d="M 700 800 C 720 850, 700 900, 660 930" fill="none"
          stroke="rgba(167,139,250,0.25)" stroke-width="3" stroke-dasharray="3 12"
          stroke-linecap="round" />
        <rect x="636" y="924" width="36" height="14" rx="7" fill="rgba(167,139,250,0.2)" />

        <!-- ground shadow -->
        <ellipse cx="1240" cy="1000" rx="580" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse cx="1440" cy="960" rx="260" ry="16" fill="rgba(124,58,237,0.12)" />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
