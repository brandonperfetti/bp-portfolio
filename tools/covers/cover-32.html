<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* per-post accent: amber (Node & APIs) */
      .glow {
        background:
          radial-gradient(
            ellipse 1400px 900px at 50% 50%,
            rgba(217, 119, 6, 0.26),
            transparent 65%
          ),
          radial-gradient(
            ellipse 1000px 700px at 18% 26%,
            rgba(217, 119, 6, 0.1),
            transparent 60%
          );
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="stage">
      <svg
        class="motif"
        viewBox="0 0 2048 1152"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <filter id="accentGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="14" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="24" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- constellation accents -->
        <g fill="rgba(255,255,255,0.22)">
          <circle cx="316" cy="184" r="4" />
          <circle cx="1794" cy="204" r="4" />
          <circle cx="1730" cy="942" r="4" />
          <circle cx="236" cy="900" r="4" />
        </g>
        <g
          stroke="rgba(255,255,255,0.16)"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M 1554 138 h 26 M 1567 125 v 26" />
          <path d="M 144 450 h 24 M 156 438 v 24" />
          <path d="M 1912 660 h 24 M 1924 648 v 24" />
        </g>

        <!-- ===== the app tower throwing sparks ===== -->
        <g transform="translate(400,470)">
          <rect
            x="-130"
            y="-250"
            width="260"
            height="500"
            rx="22"
            fill="rgba(9,9,11,0.9)"
            stroke="#fbbf24"
            stroke-width="5"
            filter="url(#bigGlow)"
          />
          <g
            stroke="rgba(251,191,36,0.5)"
            stroke-width="4.5"
            stroke-linecap="round"
          >
            <line x1="-80" y1="-170" x2="80" y2="-170" />
            <line x1="-80" y1="-90" x2="56" y2="-90" />
            <line x1="-80" y1="-10" x2="70" y2="-10" />
            <line x1="-80" y1="70" x2="48" y2="70" />
            <line x1="-80" y1="150" x2="64" y2="150" />
          </g>
          <!-- error sparks leaping out: jagged bolts -->
          <g
            stroke="#fbbf24"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            filter="url(#accentGlow)"
          >
            <path d="M 140 -160 l 40 -14 l -10 26 l 44 -8" />
            <path d="M 140 -20 l 36 10 l -6 -24 l 42 12" />
            <path d="M 140 120 l 38 22 l -4 -22 l 40 22" />
          </g>
        </g>

        <!-- ===== the centralized catch funnel ===== -->
        <g transform="translate(950,470)">
          <path
            d="M -160 -230 H 160 L 60 30 V 150 H -60 V 30 Z"
            fill="rgba(9,9,11,0.88)"
            stroke="#fbbf24"
            stroke-width="5"
            stroke-linejoin="round"
            filter="url(#bigGlow)"
          />
          <!-- sparks tumbling inside, calming into dots -->
          <path
            d="M -70 -180 l 26 -10 l -6 18 l 28 -6"
            fill="none"
            stroke="rgba(251,191,36,0.6)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 20 -120 l 24 8 l -4 -16 l 26 8"
            fill="none"
            stroke="rgba(251,191,36,0.5)"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="-10" cy="-40" r="10" fill="rgba(251,191,36,0.55)" />
          <circle
            cx="14"
            cy="60"
            r="9"
            fill="#fbbf24"
            filter="url(#accentGlow)"
          />
          <!-- classification slits at the funnel throat -->
          <g
            stroke="rgba(251,191,36,0.5)"
            stroke-width="4"
            stroke-linecap="round"
          >
            <line x1="-36" y1="112" x2="-36" y2="140" />
            <line x1="0" y1="112" x2="0" y2="140" />
            <line x1="36" y1="112" x2="36" y2="140" />
          </g>
        </g>

        <!-- routes from funnel to the three bins -->
        <g
          stroke="rgba(251,191,36,0.45)"
          stroke-width="4"
          stroke-linecap="round"
          fill="none"
        >
          <path d="M 914 630 C 860 700, 780 750, 700 780" />
          <path d="M 950 630 C 990 700, 1070 750, 1160 780" />
          <path d="M 986 624 C 1120 660, 1320 690, 1500 700" />
        </g>

        <!-- ===== bin 1: retry loop ===== -->
        <g transform="translate(620,860)">
          <rect
            x="-100"
            y="-56"
            width="200"
            height="112"
            rx="16"
            fill="rgba(9,9,11,0.9)"
            stroke="rgba(251,191,36,0.6)"
            stroke-width="4"
          />
          <path
            d="M -30 6 A 30 30 0 1 1 -9 35"
            fill="none"
            stroke="#fbbf24"
            stroke-width="4.5"
            stroke-linecap="round"
          />
          <path d="M -16 28 L -4 40 L -20 46 Z" fill="#fbbf24" />
          <rect
            x="20"
            y="-10"
            width="60"
            height="14"
            rx="7"
            fill="rgba(251,191,36,0.45)"
          />
        </g>

        <!-- ===== bin 2: alert bell ===== -->
        <g transform="translate(1240,860)">
          <rect
            x="-100"
            y="-56"
            width="200"
            height="112"
            rx="16"
            fill="rgba(9,9,11,0.9)"
            stroke="rgba(251,191,36,0.6)"
            stroke-width="4"
          />
          <path
            d="M -16 16 C -16 -8, -10 -20, 0 -24 C 10 -20, 16 -8, 16 16 H -16 Z"
            fill="none"
            stroke="#fbbf24"
            stroke-width="4"
            stroke-linejoin="round"
            filter="url(#accentGlow)"
          />
          <circle cy="24" r="5" fill="#fbbf24" />
          <g
            stroke="rgba(251,191,36,0.5)"
            stroke-width="3.5"
            stroke-linecap="round"
            fill="none"
          >
            <path d="M 28 -18 C 34 -10, 34 6, 28 14" />
            <path d="M 40 -28 C 50 -16, 50 12, 40 24" opacity="0.6" />
          </g>
          <rect
            x="-76"
            y="-10"
            width="44"
            height="14"
            rx="7"
            fill="rgba(251,191,36,0.4)"
          />
        </g>

        <!-- ===== bin 3: the structured log scroll ===== -->
        <g transform="translate(1660,760)">
          <rect
            x="-130"
            y="-90"
            width="260"
            height="180"
            rx="18"
            fill="rgba(9,9,11,0.9)"
            stroke="#fbbf24"
            stroke-width="5"
            filter="url(#accentGlow)"
          />
          <g
            stroke="rgba(251,191,36,0.5)"
            stroke-width="4"
            stroke-linecap="round"
          >
            <line x1="-90" y1="-46" x2="60" y2="-46" />
            <line x1="-90" y1="-12" x2="90" y2="-12" />
            <line x1="-90" y1="22" x2="40" y2="22" />
            <line x1="-90" y1="56" x2="74" y2="56" />
          </g>
          <g fill="rgba(251,191,36,0.55)">
            <circle cx="-108" cy="-46" r="5" />
            <circle cx="-108" cy="-12" r="5" />
            <circle cx="-108" cy="22" r="5" />
            <circle cx="-108" cy="56" r="5" />
          </g>
        </g>

        <!-- ===== the ghost: an uncaught crash, crossed out ===== -->
        <g opacity="0.45" transform="translate(1580,300)">
          <path
            d="M -60 -60 l 30 -12 l -8 22 l 34 -8 l -10 24 l 30 -6"
            fill="none"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <!-- process flatline -->
          <path
            d="M -80 60 h 70 l 12 -22 l 16 44 l 12 -22 h 30"
            fill="none"
            stroke="rgba(255,255,255,0.3)"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 66 60 h 90"
            stroke="rgba(255,255,255,0.3)"
            stroke-width="3.5"
            stroke-linecap="round"
          />
          <g
            stroke="rgba(255,255,255,0.4)"
            stroke-width="4"
            stroke-linecap="round"
          >
            <line x1="112" y1="-20" x2="152" y2="20" />
            <line x1="152" y1="-20" x2="112" y2="20" />
          </g>
        </g>

        <!-- flight path of the sparks into the funnel -->
        <path
          d="M 560 320 C 680 280, 780 260, 860 270"
          fill="none"
          stroke="rgba(251,191,36,0.35)"
          stroke-width="3.5"
          stroke-dasharray="4 12"
          stroke-linecap="round"
        />
        <path
          d="M 560 470 C 660 460, 740 440, 820 400"
          fill="none"
          stroke="rgba(251,191,36,0.3)"
          stroke-width="3.5"
          stroke-dasharray="4 12"
          stroke-linecap="round"
        />

        <!-- ground shadow -->
        <ellipse cx="1024" cy="1005" rx="660" ry="26" fill="rgba(0,0,0,0.5)" />
        <ellipse
          cx="950"
          cy="960"
          rx="280"
          ry="16"
          fill="rgba(217,119,6,0.12)"
        />
      </svg>
    </div>
    <!--GRAIN-->
  </body>
</html>
